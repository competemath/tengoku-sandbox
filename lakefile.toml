name = "tengoku"
defaultTargets = ["Tengoku"]

[leanOptions]
pp.unicode.fun = true
maxSynthPendingDepth = 3

[[lean_lib]]
name = "Tengoku"
# Every module under Tengoku/ is built — not just what the root file imports.
# The seeded root is a module-system file and cannot import the generated
# (legacy) translation modules; they are reached as `import Tengoku.<Library>`.
globs = ["Tengoku", "Tengoku.+"]

# The search-index extractor (docs/tengoku-search-plan.md): walks the compiled
# environment and writes index/decls.jsonl + deps.jsonl. Imports only Lean, so
# building it never touches the tree's own modules.
[[lean_exe]]
name = "tengoku-extract"
root = "TengokuExtract"
supportInterpreter = true

# The merge queue's axiom check (docs/tengoku-security-plan.md §5).
[[lean_exe]]
name = "tengoku-axioms"
root = "TengokuAxioms"
supportInterpreter = true
