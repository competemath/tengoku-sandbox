[tool.ruff]
line-length = 140
target-version = "py39"
# scripts/ci/warden is vendored byte for byte from tengoku-warden (scripts/ci/warden/PIN), in that repository's own style
extend-exclude = ["data", ".lake", "scripts/ci/warden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B007", "B023", "UP006", "UP007", "UP035", "UP045", "B008", "E741"]
