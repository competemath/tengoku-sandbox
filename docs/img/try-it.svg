<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-label="Three commands: search Tengoku from a shell, give an AI agent the search tool, import the library into Lean.">
<rect width="780" height="330" rx="10" fill="#0d1117"/>
<circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
<text x="390" y="25" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">tengoku</text>
<text x="20" y="58" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve"># 1. search<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0136;0.0318;0.9500;1"/></text>
<text x="20" y="82" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">$ curl -s 'https://competemath.com/api/tengoku/search?q=IsCompact.image' | head -c 230<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0364;0.0545;0.9500;1"/></text>
<text x="20" y="106" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">{"results":[{"id":3916779000,"name":"IsCompact.image","statement":"∀ {X : Type u} {Y : Type v}<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1000;0.1182;0.9500;1"/></text>
<text x="20" y="126" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">  [inst : TopologicalSpace X] [inst_1 : TopologicalSpace Y] {s : Set X} {f : X → Y}, IsCompact s<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1000;0.1182;0.9500;1"/></text>
<text x="20" y="146" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">  → Continuous f → IsCompact (f ''…<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1000;0.1182;0.9500;1"/></text>
<text x="20" y="180" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve"># 2. give an agent the search tool<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2727;0.2909;0.9500;1"/></text>
<text x="20" y="204" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">$ claude mcp add --transport sse tengoku-search https://barkingtree-leak-i.hf.space/sse<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2955;0.3136;0.9500;1"/></text>
<text x="20" y="228" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">  your agent can now search Tengoku<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3864;0.4045;0.9500;1"/></text>
<text x="20" y="262" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve"># 3. import it into Lean<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5227;0.5409;0.9500;1"/></text>
<text x="20" y="286" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">$ scripts/cache.sh get &amp;&amp; lake env lean Try.lean   # Try.lean: Mathlib's ℕ, an Equational Theories theorem<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5455;0.5636;0.9500;1"/></text>
<text x="20" y="310" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" opacity="0" xml:space="preserve">  (no output: it compiles)<animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7273;0.7455;0.9500;1"/></text>
</svg>
