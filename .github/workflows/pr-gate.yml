# PR gate (docs/tengoku-security-plan.md §4): fast, deterministic, no Lean.
# One class per PR; data files only grow; credits stay; records validate; banked
# content cannot run code; no secrets; every commit signed off. `pr-gate` is the
# one required check.
name: pr-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  BASE: ${{ github.event.pull_request.base.sha }}
  HEAD: ${{ github.event.pull_request.head.sha }}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: write }
    outputs: { class: ${{ steps.c.outputs.class }} }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: c
        run: python3 scripts/ci/classify.py "$BASE" "$HEAD"
      - name: Label the PR with its class
        if: always() && steps.c.outputs.class != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label "${{ steps.c.outputs.class }}" 2>/dev/null || true

  data-rules:
    needs: classify
    if: needs.classify.outputs.class == 'content' || needs.classify.outputs.class == 'tombstone'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - name: append-only
        run: python3 scripts/ci/append_only.py "$BASE" "$HEAD"
      - name: records
        run: python3 scripts/ci/validate_records.py "$BASE" "$HEAD"
      - name: content-lint
        run: python3 scripts/ci/lint_banked.py "$BASE" "$HEAD"

  credits:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - run: python3 scripts/ci/credits.py "$BASE" "$HEAD"

  dco:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - run: python3 scripts/ci/dco.py "$BASE" "$HEAD"

  secrets:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

  sorry-advisory:
    needs: classify
    if: needs.classify.outputs.class == 'content' || needs.classify.outputs.class == 'tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: s
        run: |
          python3 scripts/ci/sorry_scan.py "$BASE" "$HEAD" > sorry.md
          cat sorry.md
          echo "found=$(grep -c '^- ' sorry.md || true)" >> "$GITHUB_OUTPUT"
      - if: steps.s.outputs.found != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file sorry.md

  depends:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none" }
      - env: { GH_TOKEN: "${{ github.token }}", BODY: "${{ github.event.pull_request.body }}" }
        run: printf '%s' "$BODY" > body.txt && python3 scripts/ci/depends.py body.txt

  lint-python:
    needs: classify
    if: needs.classify.outputs.class == 'tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pipx install pre-commit && pre-commit run --all-files --show-diff-on-failure

  tooling-tests:
    needs: classify
    if: needs.classify.outputs.class == 'tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { filter: "blob:none" }
      - run: python3 -m unittest discover -s scripts/tests -v 2>&1 | tail -5 && python3 -m unittest scripts.ci.tests.test_gates -v 2>&1 | tail -5
      - uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
        with: { args: -color }

  pr-gate:
    needs: [classify, data-rules, credits, dco, secrets, depends, lint-python, tooling-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job of this PR's class passed
        env: { RESULTS: "${{ toJSON(needs) }}" }
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          bad = [k for k, v in r.items() if v["result"] in ("failure", "cancelled")]
          print({k: v["result"] for k, v in r.items()})
          sys.exit(1 if bad or r["classify"]["result"] != "success" else 0)'
