# PR gate (docs/tengoku-security-plan.md §4): fast, deterministic, no Lean.
# One class per PR; data files only grow; credits stay; records validate; banked
# content cannot run code; no secrets; every commit signed off. `pr-gate` is the
# one required check.
#
# The checks always come from main: a PR never supplies the rules that judge it. `pull_request_target`
# runs this file as it is on main (a `pull_request` run would take the PR's copy, which a PR can edit
# to pass), and every job checks out main's commit and reads the PR only as data (git objects, and for
# vacuity the PR's data/ files laid over main's tree). Nothing here runs the PR's scripts, and every
# checkout drops its token (persist-credentials: false). The PR's own test suite runs in pr-tests.yml.
# A change to this file therefore takes effect only once merged: prove it in tengoku-sandbox first.
name: pr-gate
# Runs on the PR and again on the merge group: a required check must report on both.
on:
  pull_request_target:
    branches: [main]   # a PR into any other branch is not judged here and never reaches main
    types: [opened, synchronize, reopened, edited]
  merge_group:
permissions: {}
defaults:
  run:
    shell: bash   # every `run:` gets `-e -o pipefail` — a piped command's failure fails the step (the campaign found two silent passes)
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true
env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  # where the PR's commits are fetched from (a fork's commits are reachable from refs/pull/<n>/head)
  PR_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.event.merge_group.head_ref }}
jobs:
  # On the PR: one job per check (classify first, the others need it). In the merge queue none of them runs:
  # the pr-gate job below checks the queue entry by itself (why is written there).
  classify:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }   # reads the PR's commits and runs main's scripts: no write token here (the label job below holds it)
    outputs: { class: "${{ steps.c.outputs.class }}" }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - id: c
        name: classify
        env:
          PR_ACTOR: "${{ github.event.pull_request.user.login }}"
          TENGOKU_BOT: "${{ vars.TENGOKU_BOT || 'tengoku-bot' }}"
          TENGOKU_ACTOR_CHECKED: "${{ github.event_name == 'merge_group' && '1' || '' }}"  # the PR's own gate verified the actor
        run: python3 scripts/ci/classify.py "$BASE" "$HEAD"

  # The only thing the class is used for here is a label. This job holds the write token and touches nothing of the PR: it has no checkout and
  # no fetch, takes the class from the classify job's output, and refuses any value that is not one of the fixed class names.
  label:
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.class != '' && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { pull-requests: write }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - name: Label the PR with its class
        env: { GH_TOKEN: "${{ github.token }}", CLASS: "${{ needs.classify.outputs.class }}", PR: "${{ github.event.pull_request.number }}" }
        run: |
          case "$CLASS" in content|tombstone|tooling|docs|promotion|derived|intake|extend|scope-fix|restructure|tag) ;; *) echo "::error::not a class name"; exit 1 ;; esac
          # one class label at a time: a PR whose class changes (docs, then content) loses the old one
          old=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -xE 'content|tombstone|tooling|docs|promotion|derived|intake|extend|scope-fix|restructure|tag' | grep -vxF "$CLASS" | paste -sd, - || true)
          args=(--add-label "$CLASS"); [ -n "$old" ] && args+=(--remove-label "$old")
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" "${args[@]}" || echo "::warning::could not label the PR '$CLASS' (scripts/ci/labels.sh creates the class labels)"

  data-rules:
    needs: classify
    if: contains(fromJSON('["content","tombstone","promotion"]'), needs.classify.outputs.class)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: append-only
        run: python3 scripts/ci/append_only.py "$BASE" "$HEAD" ${{ needs.classify.outputs.class == 'promotion' && '--promotion' || '' }}
      - name: records
        run: python3 scripts/ci/validate_records.py "$BASE" "$HEAD"
      - name: content-lint
        env: { TENGOKU_INTAKE_LINT: "${{ vars.TENGOKU_INTAKE_LINT || 'strict' }}" }
        run: python3 scripts/ci/lint_banked.py "$BASE" "$HEAD"

  credits:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: credits
        run: python3 scripts/ci/credits.py "$BASE" "$HEAD" ${{ needs.classify.outputs.class == 'promotion' && '--promotion' || '' }} ${{ needs.classify.outputs.class == 'restructure' && '--restructure' || '' }}

  # GOALS.md: its shape, real references, and the AI reviewer writing only Suggestions (docs/goals.md).
  goals:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: goals
        env:
          # the AI reviewer's PRs come from branches goals-suggest/… (or the account in vars.GOALS_AI_ACCOUNT)
          GOALS_AI: "${{ (startsWith(github.event.pull_request.head.ref, 'goals-suggest/') || (vars.GOALS_AI_ACCOUNT != '' && github.event.pull_request.user.login == vars.GOALS_AI_ACCOUNT)) && '1' || '' }}"
        run: python3 scripts/ci/goals_check.py "$BASE" "$HEAD"
  dco:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: dco
        run: python3 scripts/ci/dco.py "$BASE" "$HEAD"

  # An intake PR (a factory bundle: one library's verified Lean modules) is judged by its shape, its manifest, the content lint on every
  # module and the factory's build attestation over the very bytes of the PR. Nothing of the PR runs; the queue builds the library.
  # An extend PR is the next part of a library that arrived in parts: the same checks on the part, and that it continues what is in the tree.
  intake:
    needs: classify
    if: github.event_name == 'pull_request_target' && (needs.classify.outputs.class == 'intake' || needs.classify.outputs.class == 'extend')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      # The base commit with plain git, not actions/checkout: the repository is public, so nothing needs a token (the next step fetches the PR the
      # same way), and no credential is ever written into the checkout. Only the base is checked out; the PR is read as git objects.
      - name: The base commit (the checks are main's)
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --filter=blob:none origin "$BASE"
          git checkout -q --detach "$BASE"
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: intake checks
        env: { LINT: "${{ vars.TENGOKU_INTAKE_LINT || 'strict' }}" }
        run: python3 scripts/ci/intake_check.py "$BASE" "$HEAD" --lint "$LINT" --tar "$RUNNER_TEMP/bundle.tar"
      - name: provenance (the factory built exactly these bytes)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for wf in bump-library bump-sharded; do
            if gh attestation verify "$RUNNER_TEMP/bundle.tar" --repo competemath/emissary-archangel \
                 --signer-workflow "competemath/emissary-archangel/.github/workflows/$wf.yml"; then ok=1; break; fi
          done
          [ "${ok:-0}" = 1 ] || { echo "::error::no build attestation of competemath/emissary-archangel matches the bundle in this PR"; exit 1; }

  # A tag PR (isnad tags written into modules that are already in the tree) is judged without Lean: after the tags are taken out, the code is the base's bytes
  # and every docstring the base's words, every tag is well formed and says where its module is from (scripts/ci/tag_check.py). Nothing of the PR runs; the merge
  # queue builds the modules and recomputes every tag.
  tag:
    needs: classify
    if: github.event_name == 'pull_request_target' && needs.classify.outputs.class == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      # The base commit with plain git (see the scope-fix job): only the base is checked out, the PR is read as git objects.
      - name: The base commit (the checks are main's)
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --filter=blob:none origin "$BASE"
          git checkout -q --detach "$BASE"
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: tag checks
        run: python3 scripts/ci/tag_check.py "$BASE" "$HEAD"

  # A scope-fix PR (a merged intake library's global registrations made local) is judged line by line: only `local ` inserted before
  # instance/simp, the library's own registrations repeated as local attributes, blank lines and one note comment. Nothing of the PR runs.
  scope-fix:
    needs: classify
    if: github.event_name == 'pull_request_target' && needs.classify.outputs.class == 'scope-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      # The base commit with plain git, not actions/checkout: the repository is public, so nothing needs a token (the next step fetches the PR the
      # same way), and no credential is ever written into the checkout. Only the base is checked out; the PR is read as git objects.
      - name: The base commit (the checks are main's)
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --filter=blob:none origin "$BASE"
          git checkout -q --detach "$BASE"
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: scope-fix checks
        run: python3 scripts/ci/scope_fix_check.py "$BASE" "$HEAD"

  # Every `import Tengoku…` of a module this PR adds or edits (or, when it removes or moves a module, of the whole tree) names a module that exists after the
  # change (scripts/ci/imports_resolve.py). No Lean runs: it is files and header lines, read as git objects; nothing of the PR runs. It exists because a PR
  # that was green when opened can be broken by what merged after it, and that used to show only in the merge queue's multi-hour build.
  imports:
    needs: classify
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - name: The base commit (the checks are main's)
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --filter=blob:none origin "$BASE"
          git checkout -q --detach "$BASE"
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: every import resolves
        run: python3 scripts/ci/imports_resolve.py "$BASE" "$HEAD"

  # A restructure PR (the seed moved into Tengoku/Seed/) is not read, it is recomputed: scripts/restructure.py of the base commit runs on the base
  # tree and the PR must equal its output byte for byte. Nothing of the PR runs; it is read as git objects only.
  restructure:
    needs: classify
    if: github.event_name == 'pull_request_target' && needs.classify.outputs.class == 'restructure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - name: The base commit (the checks are main's)
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --filter=blob:none origin "$BASE"
          git checkout -q --detach "$BASE"
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: restructure checks
        run: python3 scripts/ci/restructure_check.py "$BASE" "$HEAD"

  secrets:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a restructure PR moves the whole seed: TruffleHog reads it all as added lines
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
          extra_args: --results=verified,unknown
      # TruffleHog reports only credentials it can verify or cannot check; a credential-shaped
      # string that fails verification passes it. The same pattern scan as the pre-commit hook
      # runs here for every class, so a secret inside a record is caught too (found by the campaign).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: detect-secrets on the changed files (every class)
        shell: bash
        run: |  # pragma: allowlist secret
          pip install -q --require-hashes -r scripts/ci/requirements/secrets.txt   # main's pins (this job's checkout is main)
          git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- . ':!data/' ':!Tengoku/' ':!.lake/' ':!scripts/ci/campaign/' > changed.txt   # the campaign's fixtures hold fake credentials
          mapfile -t files < changed.txt
          # the PR's versions of those files, scanned against main's baseline (a PR cannot allowlist its own secret)
          mkdir -p pr-files
          for f in "${files[@]}"; do mkdir -p "pr-files/$(dirname "$f")" && git show "$HEAD:$f" > "pr-files/$f"; done
          cp .secrets.baseline pr-files/ 2>/dev/null || true
          cd pr-files
          if [ "${#files[@]}" -gt 0 ]; then detect-secrets-hook --baseline .secrets.baseline --exclude-lines '"[a-z_]*commit": "[0-9a-f]{40}"' --exclude-lines '"[a-z_]*(sha256|digest)": "[0-9a-f]{64}"' --exclude-lines '"(search|states|verify)": "[0-9a-f]{40}"' --exclude-lines '"source_url": "[^"]*[0-9a-f]{40}[^"]*"' "${files[@]}"; else echo "no non-data files to scan"; fi
          # records: scan the added lines of data files as text (a content-only PR reaches only this scan — round 2 of the
          # campaign found the step exiting before it). Key ids and tokens are found inside JSON strings; a bare AWS secret
          # key value is not (detect-secrets keyword rules need the plain "key = value" form).
          cd "$GITHUB_WORKSPACE"
          # data/stats.json is generated (scripts/stats.py): its pretty-printed "tree_commit" line reads as a hex secret, and
          # detect-secrets never applies an --exclude-lines pattern that spells out the hex (tested with 1.5.0), so every
          # promotion PR failed here; the file holds only counts and that commit
          git diff -U0 "$BASE...$HEAD" -- data/ ':!data/stats.json' | grep -E '^\+[^+]' | sed 's/^+//' > added-data.txt || true
          if [ -s added-data.txt ]; then detect-secrets-hook --baseline .secrets.baseline --exclude-lines '"[a-z_]*commit": "[0-9a-f]{40}"' --exclude-lines '"[a-z_]*(sha256|digest)": "[0-9a-f]{64}"' --exclude-lines '"(search|states|verify)": "[0-9a-f]{40}"' --exclude-lines '"source_url": "[^"]*[0-9a-f]{40}[^"]*"' added-data.txt; else echo "no added data lines to scan"; fi

  sorry-advisory:
    needs: classify
    if: needs.classify.outputs.class == 'content' || needs.classify.outputs.class == 'tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }   # advisory: what it finds is quoted in the gate comment, which the one privileged job writes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - id: s
        run: |
          python3 scripts/ci/sorry_scan.py "$BASE" "$HEAD" > sorry.md
          cat sorry.md
          echo "found=$(grep -c '^- ' sorry.md || true)" >> "$GITHUB_OUTPUT"

  # A new theorem whose hypotheses can never all hold proves nothing (vacuity). Its candidate module
  # is built here, before the queue, and the PR fails until the description acknowledges each such
  # theorem with a reason (`Vacuous-Ack: <theorem>: <why>`): after the queue, nobody would look.
  # The one job that runs the PR's content: it compiles the PR's records. It starts only after the content
  # lint passed, does every networked step first, and compiles in a sealed namespace (below).
  vacuity:
    needs: [classify, data-rules]
    if: needs.classify.outputs.class == 'content' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read }
    env:   # the same seed the queue starts from (queue-gate.yml): this repository's own caches, verified, plus the newest top-up
      TENGOKU_REPO: ${{ github.repository }}
      TENGOKU_VERIFY: require
      TENGOKU_TOPUPS: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
          "$HOME/.elan/bin/lake" --version   # installs the tree's toolchain now, while there is network
      - name: The PR's records over main's tree (data only; every script and tool stays main's)
        run: git checkout -q "$HEAD" -- data
      - name: The compiled tree
        env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/cache.sh get 2>&1 | tail -3
      # Candidate modules, generated by main's generate.py from the PR's records: clones the corpora and pulls
      # every blob the next step reads, so it needs no network. Nothing here runs Lean.
      - name: Candidate modules (no Lean runs here)
        run: python3 scripts/ci/queue_targets.py "$BASE" "$HEAD"
      # Compiling the candidates runs the PR's Lean. It happens with no network (a new network namespace), no
      # sight of the runner's processes (a new PID namespace with its own /proc) and an empty environment, so
      # it can reach neither GitHub's cache service nor a token; the job ends right after, so nothing persists.
      - name: vacuity (sealed)
        env: { BODY: "${{ github.event.pull_request.body }}" }
        run: |
          printf '%s' "$BODY" > body.txt
          sudo unshare --net --pid --fork --mount-proc runuser -u "$(id -un)" -- \
            env -i HOME="$HOME" PATH="$HOME/.elan/bin:/usr/local/bin:/usr/bin:/bin" LANG=C.UTF-8 \
            TENGOKU_CI_ROOT="$GITHUB_WORKSPACE" python3 scripts/ci/vacuity.py "$BASE" "$HEAD" body.txt

  # The workflow rules (scripts/ci/workflow_rules.py): main's checker reads the workflow and action files
  # the PR adds or changes from the PR's commit, and verifies their pins against GitHub (impostor commits).
  workflows:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: workflow rules
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # the PR that adds this check runs it in its merge group, whose workflow file is the PR's, before main has the
          # script: skip only then (a PR that deletes the script fails the checker itself)
          if [ ! -f scripts/ci/workflow_rules.py ]; then
            git cat-file -e "$HEAD:scripts/ci/workflow_rules.py" 2>/dev/null && { echo "main has no workflow_rules.py yet: this PR adds it"; exit 0; }
            echo "::error::neither main nor this PR has scripts/ci/workflow_rules.py"; exit 1
          fi
          pip install -q --require-hashes -r scripts/ci/requirements/yaml.txt
          python3 scripts/ci/workflow_rules.py --online --changed "$BASE" "$HEAD"

  depends:
    needs: classify
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", filter: "blob:none", persist-credentials: false }
      - name: depends
        env: { GH_TOKEN: "${{ github.token }}", BODY: "${{ github.event.pull_request.body }}" }
        run: printf '%s' "$BODY" > body.txt && python3 scripts/ci/depends.py body.txt

  # The merge queue's re-check of an entry (the PR merged onto what is ahead of it) against its new base. It reads the entry's commits as data
  # and runs main's scripts; it holds no write token. The privileged `pr-gate` job below never touches the entry's commits.
  queue-recheck:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      # The base commit with plain git, not actions/checkout: the repository is public, so nothing needs a token and none is ever written into
      # the checkout (the same as the scope-fix and restructure jobs). The entry is read as git objects.
      - name: The base commit (the checks are main's)
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --filter=blob:none origin "$BASE"
          git checkout -q --detach "$BASE"
      - name: The entry's commits, as data (the checks are main's)
        if: github.event_name == 'merge_group'
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - id: c
        name: classify
        if: github.event_name == 'merge_group'
        env:
          TENGOKU_BOT: "${{ vars.TENGOKU_BOT || 'tengoku-bot' }}"
          TENGOKU_ACTOR_CHECKED: "1"   # the PR's own gate verified the actor
        run: python3 scripts/ci/classify.py "$BASE" "$HEAD"
      - name: Every import still resolves, on the merged result
        if: github.event_name == 'merge_group'
        run: |
          # The checks are main's: this job has the base's files only. The group that introduces the script has no copy of it here (the sandbox ejected such a
          # group on 2026-10-05); once main has it, it always runs, even in a group that deletes it.
          if [ ! -f scripts/ci/imports_resolve.py ]; then echo "imports_resolve.py is introduced by this group: main has no copy to run yet"; exit 0; fi
          python3 scripts/ci/imports_resolve.py "$BASE" "$HEAD"
      - name: The records, or the move of the seed, against everything merged ahead of them
        if: github.event_name == 'merge_group' && contains(fromJSON('["content","tombstone","promotion","restructure"]'), steps.c.outputs.class)
        env: { CLASS: "${{ steps.c.outputs.class }}", TENGOKU_INTAKE_LINT: "${{ vars.TENGOKU_INTAKE_LINT || 'strict' }}" }
        run: |
          # The move of the seed (docs/pr-classes.md, section 5) depends on everything merged ahead of it: a library that arrived meanwhile has
          # headers the script must rewrite. It is recomputed on the entry's base.
          if [ "$CLASS" = restructure ]; then python3 scripts/ci/restructure_check.py "$BASE" "$HEAD"; exit 0; fi
          promotion=(); [ "$CLASS" = promotion ] && promotion=(--promotion)
          python3 scripts/ci/append_only.py "$BASE" "$HEAD" "${promotion[@]}"
          python3 scripts/ci/validate_records.py "$BASE" "$HEAD"
          python3 scripts/ci/lint_banked.py "$BASE" "$HEAD"

  pr-gate:
    needs: [classify, data-rules, credits, dco, secrets, workflows, depends, vacuity, goals, intake, scope-fix, tag, restructure, imports, sorry-advisory, queue-recheck]
    # `!cancelled()`, not `always()`: a run that a newer run has cancelled (the PR was pushed to or edited again: CodeRabbit rewrites the description after its review, which is an
    # `edited` event) would still run this job, and its failure stays on the commit as the latest `pr-gate` after the newer run has passed: the PR is blocked for nothing
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: write, pull-requests: write }   # actions: write — to stop the runs of removed queue entries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      # In the merge queue. Each entry is built on the entry ahead of it, so BASE...HEAD is still only this PR's
      # change, and its own gate already passed on that change: credits, sign-off, secrets and the workflow rules
      # would give the same answer again. What the new base can change is checked by `queue-recheck` (above): the class,
      # and a data change's records against everything merged ahead of them. This job holds write tokens and never
      # reads the entry's commits: it stops stale queue runs (API calls) and says whether the re-check passed.
      # (Nine jobs per entry, five entries at a time, starved the runners: entries waited past the queue's 40-minute
      # timeout and were removed, and the queue restarted every entry behind them.)
      - name: Stop the runs of queue entries that no longer exist
        if: github.event_name == 'merge_group'
        env: { GH_TOKEN: "${{ github.token }}", OWN: "${{ github.event.merge_group.head_ref }}" }
        run: |
          # a rebuilt or removed entry's runs keep going (up to 90 minutes) on runners the live entries wait for
          live="$(git ls-remote origin 'refs/heads/gh-readonly-queue/*' | awk '{print $2}' | sed 's#^refs/heads/##')" || { echo "could not list the queue; nothing stopped"; exit 0; }
          grep -qxF "${OWN#refs/heads/}" <<< "$live" || { echo "this entry is not in the listing; nothing stopped"; exit 0; }
          for status in in_progress queued waiting requested pending; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&status=$status&per_page=100" --jq '.workflow_runs[] | "\(.id) \(.head_branch)"'
          done | sort -u | while read -r id branch; do
            if ! grep -qxF "$branch" <<< "$live"; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 && echo "stopped run $id: $branch is no longer in the queue"
            fi
          done || true
      # One comment per PR (updated in place): which check failed, what it said, what to do, and a
      # prefilled "Report a gate bug" issue link for the checks complex enough to be wrong themselves.
      - name: Explain the verdict on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ env.HEAD }}
          PR_CLASS: ${{ needs.classify.outputs.class }}
        run: python3 scripts/ci/gate_summary.py
      - name: Every job of this PR's class passed
        if: github.event_name == 'pull_request_target'
        env: { RESULTS: "${{ toJSON(needs) }}" }
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          bad = [k for k, v in r.items() if v["result"] in ("failure", "cancelled") and k != "sorry-advisory"]  # skipped jobs are fine; the advisory never blocks
          print({k: v["result"] for k, v in r.items()})
          sys.exit(1 if bad or r["classify"]["result"] != "success" else 0)'
      - name: The queue entry's re-check passed
        if: github.event_name == 'merge_group'
        env: { RECHECK: "${{ needs.queue-recheck.result }}" }
        run: |
          echo "queue-recheck: $RECHECK"
          [ "$RECHECK" = success ]
