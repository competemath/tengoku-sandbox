# PR gate (docs/tengoku-security-plan.md §4): fast, deterministic, no Lean.
# One class per PR; data files only grow; credits stay; records validate; banked
# content cannot run code; no secrets; every commit signed off. `pr-gate` is the
# one required check.
#
# The checks always come from main: a PR never supplies the rules that judge it. `pull_request_target`
# runs this file as it is on main (a `pull_request` run would take the PR's copy, which a PR can edit
# to pass), and every job checks out main's commit and reads the PR only as data (git objects, and for
# vacuity the PR's data/ files laid over main's tree). Nothing here runs the PR's scripts, and every
# checkout drops its token (persist-credentials: false). The PR's own test suite runs in pr-tests.yml.
# A change to this file therefore takes effect only once merged: prove it in tengoku-sandbox first.
name: pr-gate
# Runs on the PR and again on the merge group: a required check must report on both.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:
permissions: {}
defaults:
  run:
    shell: bash   # every `run:` gets `-e -o pipefail` — a piped command's failure fails the step (the campaign found two silent passes)
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true
env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  # where the PR's commits are fetched from (a fork's commits are reachable from refs/pull/<n>/head)
  PR_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.event.merge_group.head_ref }}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: write }
    outputs: { class: "${{ steps.c.outputs.class }}" }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - id: c
        name: classify
        env:
          PR_ACTOR: "${{ github.event.pull_request.user.login }}"
          TENGOKU_BOT: "${{ vars.TENGOKU_BOT || 'tengoku-bot' }}"
          TENGOKU_ACTOR_CHECKED: "${{ github.event_name == 'merge_group' && '1' || '' }}"  # the PR's own gate verified the actor
        run: python3 scripts/ci/classify.py "$BASE" "$HEAD"
      - name: Label the PR with its class
        if: always() && steps.c.outputs.class != '' && github.event_name == 'pull_request_target'
        env: { GH_TOKEN: "${{ github.token }}", CLASS: "${{ steps.c.outputs.class }}", PR: "${{ github.event.pull_request.number }}" }
        run: |
          # one class label at a time: a PR whose class changes (docs, then content) loses the old one
          old=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -xE 'content|tombstone|tooling|docs|promotion|derived' | grep -vxF "$CLASS" | paste -sd, - || true)
          args=(--add-label "$CLASS"); [ -n "$old" ] && args+=(--remove-label "$old")
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" "${args[@]}" || echo "::warning::could not label the PR '$CLASS' (scripts/ci/labels.sh creates the class labels)"

  data-rules:
    needs: classify
    if: contains(fromJSON('["content","tombstone","promotion"]'), needs.classify.outputs.class)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: append-only
        run: python3 scripts/ci/append_only.py "$BASE" "$HEAD" ${{ needs.classify.outputs.class == 'promotion' && '--promotion' || '' }}
      - name: records
        run: python3 scripts/ci/validate_records.py "$BASE" "$HEAD"
      - name: content-lint
        run: python3 scripts/ci/lint_banked.py "$BASE" "$HEAD"

  credits:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: credits
        run: python3 scripts/ci/credits.py "$BASE" "$HEAD" ${{ needs.classify.outputs.class == 'promotion' && '--promotion' || '' }}

  dco:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: dco
        run: python3 scripts/ci/dco.py "$BASE" "$HEAD"

  secrets:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
          extra_args: --results=verified,unknown
      # TruffleHog reports only credentials it can verify or cannot check; a credential-shaped
      # string that fails verification passes it. The same pattern scan as the pre-commit hook
      # runs here for every class, so a secret inside a record is caught too (found by the campaign).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: detect-secrets on the changed files (every class)
        shell: bash
        run: |  # pragma: allowlist secret
          pip install -q detect-secrets==1.5.0
          git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- . ':!data/' ':!Tengoku/' ':!.lake/' ':!scripts/ci/campaign/' > changed.txt   # the campaign's fixtures hold fake credentials
          mapfile -t files < changed.txt
          # the PR's versions of those files, scanned against main's baseline (a PR cannot allowlist its own secret)
          mkdir -p pr-files
          for f in "${files[@]}"; do mkdir -p "pr-files/$(dirname "$f")" && git show "$HEAD:$f" > "pr-files/$f"; done
          cp .secrets.baseline pr-files/ 2>/dev/null || true
          cd pr-files
          if [ "${#files[@]}" -gt 0 ]; then detect-secrets-hook --baseline .secrets.baseline --exclude-lines '"[a-z_]*commit": "[0-9a-f]{40}"' --exclude-lines '"[a-z_]*(sha256|digest)": "[0-9a-f]{64}"' --exclude-lines '"(search|states|verify)": "[0-9a-f]{40}"' --exclude-lines '"source_url": "[^"]*[0-9a-f]{40}[^"]*"' "${files[@]}"; else echo "no non-data files to scan"; fi
          # records: scan the added lines of data files as text (a content-only PR reaches only this scan — round 2 of the
          # campaign found the step exiting before it). Key ids and tokens are found inside JSON strings; a bare AWS secret
          # key value is not (detect-secrets keyword rules need the plain "key = value" form).
          cd "$GITHUB_WORKSPACE"
          git diff -U0 "$BASE...$HEAD" -- data/ | grep -E '^\+[^+]' | sed 's/^+//' > added-data.txt || true
          if [ -s added-data.txt ]; then detect-secrets-hook --baseline .secrets.baseline --exclude-lines '"[a-z_]*commit": "[0-9a-f]{40}"' --exclude-lines '"[a-z_]*(sha256|digest)": "[0-9a-f]{64}"' --exclude-lines '"(search|states|verify)": "[0-9a-f]{40}"' --exclude-lines '"source_url": "[^"]*[0-9a-f]{40}[^"]*"' added-data.txt; else echo "no added data lines to scan"; fi

  sorry-advisory:
    needs: classify
    if: needs.classify.outputs.class == 'content' || needs.classify.outputs.class == 'tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - id: s
        run: |
          python3 scripts/ci/sorry_scan.py "$BASE" "$HEAD" > sorry.md
          cat sorry.md
          echo "found=$(grep -c '^- ' sorry.md || true)" >> "$GITHUB_OUTPUT"
      - if: steps.s.outputs.found != '0' && github.event_name == 'pull_request_target'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file sorry.md

  # A new theorem whose hypotheses can never all hold proves nothing (vacuity). Its candidate module
  # is built here, before the queue, and the PR fails until the description acknowledges each such
  # theorem with a reason (`Vacuous-Ack: <theorem>: <why>`): after the queue, nobody would look.
  # The one job that runs the PR's content: it compiles the PR's records. It starts only after the content
  # lint passed, does every networked step first, and compiles in a sealed namespace (below).
  vacuity:
    needs: [classify, data-rules]
    if: needs.classify.outputs.class == 'content' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read }
    env:   # the same seed the queue starts from (queue-gate.yml): this repository's own caches, verified, plus the newest top-up
      TENGOKU_REPO: ${{ github.repository }}
      TENGOKU_VERIFY: require
      TENGOKU_TOPUPS: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - name: Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
          "$HOME/.elan/bin/lake" --version   # installs the tree's toolchain now, while there is network
      - name: The PR's records over main's tree (data only; every script and tool stays main's)
        run: git checkout -q "$HEAD" -- data
      - name: The compiled tree
        env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/cache.sh get 2>&1 | tail -3
      # Candidate modules, generated by main's generate.py from the PR's records: clones the corpora and pulls
      # every blob the next step reads, so it needs no network. Nothing here runs Lean.
      - name: Candidate modules (no Lean runs here)
        run: python3 scripts/ci/queue_targets.py "$BASE" "$HEAD"
      # Compiling the candidates runs the PR's Lean. It happens with no network (a new network namespace), no
      # sight of the runner's processes (a new PID namespace with its own /proc) and an empty environment, so
      # it can reach neither GitHub's cache service nor a token; the job ends right after, so nothing persists.
      - name: vacuity (sealed)
        env: { BODY: "${{ github.event.pull_request.body }}" }
        run: |
          printf '%s' "$BODY" > body.txt
          sudo unshare --net --pid --fork --mount-proc runuser -u "$(id -un)" -- \
            env -i HOME="$HOME" PATH="$HOME/.elan/bin:/usr/local/bin:/usr/bin:/bin" LANG=C.UTF-8 \
            TENGOKU_CI_ROOT="$GITHUB_WORKSPACE" python3 scripts/ci/vacuity.py "$BASE" "$HEAD" body.txt

  # The workflow rules (scripts/ci/workflow_rules.py): main's checker reads the workflow and action files
  # the PR adds or changes from the PR's commit, and verifies their pins against GitHub (impostor commits).
  workflows:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: The PR's commits, as data (the checks are main's)
        run: git fetch -q --no-tags --filter=blob:none origin "+$PR_REF:refs/remotes/origin/pr-head" && git cat-file -e "$HEAD^{commit}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: workflow rules
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # the PR that adds this check runs it in its merge group, whose workflow file is the PR's, before main has the
          # script: skip only then (a PR that deletes the script fails the checker itself)
          if [ ! -f scripts/ci/workflow_rules.py ]; then
            git cat-file -e "$HEAD:scripts/ci/workflow_rules.py" 2>/dev/null && { echo "main has no workflow_rules.py yet: this PR adds it"; exit 0; }
            echo "::error::neither main nor this PR has scripts/ci/workflow_rules.py"; exit 1
          fi
          pip install -q pyyaml==6.0.2
          python3 scripts/ci/workflow_rules.py --online --changed "$BASE" "$HEAD"

  depends:
    needs: classify
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", filter: "blob:none", persist-credentials: false }
      - name: depends
        env: { GH_TOKEN: "${{ github.token }}", BODY: "${{ github.event.pull_request.body }}" }
        run: printf '%s' "$BODY" > body.txt && python3 scripts/ci/depends.py body.txt

  pr-gate:
    needs: [classify, data-rules, credits, dco, secrets, workflows, depends, vacuity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: read, pull-requests: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.BASE }}", filter: "blob:none", persist-credentials: false }
      # One comment per PR (updated in place): which check failed, what it said, what to do, and a
      # prefilled "Report a gate bug" issue link for the checks complex enough to be wrong themselves.
      - name: Explain the verdict on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ env.HEAD }}
          PR_CLASS: ${{ needs.classify.outputs.class }}
        run: python3 scripts/ci/gate_summary.py
      - name: Every job of this PR's class passed
        env: { RESULTS: "${{ toJSON(needs) }}" }
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          bad = [k for k, v in r.items() if v["result"] in ("failure", "cancelled")]  # skipped jobs are fine
          print({k: v["result"] for k, v in r.items()})
          sys.exit(1 if bad or r["classify"]["result"] != "success" else 0)'
