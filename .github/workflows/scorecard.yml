# OpenSSF Scorecard: a public score of this repository's security practices (pinned actions, token permissions,
# branch protection, dangerous workflow patterns, …), published weekly for the README badge
# (https://scorecard.dev/viewer/?uri=github.com/competemath/tengoku). Weekly rather than per merge: the queue merges
# many times a day, and runners are shared with it.
name: scorecard
on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays
  workflow_dispatch:
permissions: {}
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, actions: read, id-token: write }   # id-token: publishing the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # everything but the records and the generated Lean tree (3 GB)
            /*
            !/data/
            !/Tengoku/
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
