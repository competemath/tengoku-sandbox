# A top-up published by the merge queue is provisional. This workflow makes it the one the services
# follow, and only for a commit that is really on main: it writes the top-up into cache-latest.json.
# It also collects top-ups whose commit never reached main (a group that failed or was rebuilt) and
# ones a newer top-up replaced, and starts a cache build when main's tip was too big for the queue's
# build budget (marked "incomplete" there). Runs are serialized; each run looks at main's tip, so a skipped run
# loses nothing.
name: topup-promote
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: topup-promote
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  TENGOKU_REPO: ${{ github.repository }}
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, actions: write }   # actions: write — to start a cache build for an incomplete tip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main, fetch-depth: 0, filter: "blob:none" }
      - name: Name the newest top-up on main in the pointer, collect the rest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sudo apt-get install -y -q zstd >/dev/null
          git fetch -q origin main
          scripts/cache.sh topup-promote
          scripts/cache.sh topup-gc
          tip="$(git rev-parse origin/main)"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/cache-topups" -q '.assets[].name' 2>/dev/null | grep -qx "topup-$tip.incomplete"; then
            busy=$(( $(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --status in_progress --json databaseId -q 'length') + $(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --status queued --json databaseId -q 'length') ))
            if [ "$busy" = 0 ]; then gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main && echo "main's tip has no complete top-up: started a cache build"; else echo "main's tip has no complete top-up; a cache build is already running"; fi
          fi
      # The services follow main merge by merge: ask each one to look at the pointer. They coalesce
      # requests and swap in place (no rebuild of their image); an unreachable one catches up on its
      # next request or start. The list is a repository variable, so a sandbox can point at its own.
      - name: Tell the services
        env: { SPACES: "${{ vars.TENGOKU_SPACES }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          # The pointer is served through a CDN: for a few seconds after an update a reader can still get
          # the old one (seen in the soak: the services were asked 3 s after the update, read the old
          # pointer, answered "current" and stayed one merge behind). Wait until it is publicly visible.
          want="$(git rev-parse origin/main)"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/cache-topups" -q '.assets[].name' 2>/dev/null | grep -qx "topup-$want.json"; then
            for i in $(seq 1 30); do
              seen="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/cache-latest/cache-latest.json" 2>/dev/null | python3 -c 'import json,sys; print((json.load(sys.stdin).get("topup") or {}).get("commit",""))' 2>/dev/null || true)"
              [ "$seen" = "$want" ] && break
              sleep 3
            done
            sleep 5
          fi
          for space in $SPACES; do
            host="$(echo "$space" | tr '/A-Z' '-a-z').hf.space"
            out="$(curl -sS -m 30 -X POST "https://$host/refresh" 2>&1 | head -c 300)" || true
            echo "$space: ${out:-no answer}"
          done
