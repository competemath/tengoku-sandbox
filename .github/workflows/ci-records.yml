# Platform-sourced records of this repository's workflow runs (docs/ci-records.md): every hour, the completed runs since the watermark, each with its jobs,
# its timings from the platform's own timestamps, and for a failed job the class an anchored rule gave it. The records go to the append-only,
# hash-chained `ci-records` branch. ADVISORY and silent: nothing reads them to decide anything yet; the failure rate per actor and per agent in the run
# summary is what they are for.
#
# Same discipline as trust-shadow.yml: reading the platform (job `collect`, `actions: read`, no write permission) and writing the branch (job `append`,
# `contents: write`) are different jobs; the second takes one validated JSON file, writes the immutable files first and the chain file last, and uses the
# chain file's blob sha as a compare-and-swap. One writer at a time. A pull request that changes the collector runs the first job only (a dry run on
# the real platform, nothing is written).
name: ci-records
on:
  schedule:
    - cron: "17 * * * *"   # hourly: the platform keeps no history of its own that is worth more often
  workflow_dispatch:
  pull_request:
    paths: [scripts/ci/ci_records.py, scripts/ci/ci-actors.json, "scripts/ci/warden/**", .github/workflows/ci-records.yml]
permissions: {}
concurrency:
  group: ci-records-${{ github.event_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { actions: read, contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # what is already recorded: the branch is read as data (its chain is verified before anything is trusted), never run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: ci-records, path: records, persist-credentials: false }
      - name: Collect
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 scripts/ci/ci_records.py collect --repo "$GITHUB_REPOSITORY" --records records --out "$RUNNER_TEMP/batch" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: ci-records-batch, path: "${{ runner.temp }}/batch/batch.json", retention-days: 7 }

  append:
    needs: collect
    # `!cancelled()`, not `always()` (the rule `cancelable` of workflow_rules.py); never on a pull request
    if: ${{ !cancelled() && needs.collect.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the only job that writes to the repository's contents; one writer at a time, across schedule and dispatch
    concurrency: { group: ci-records-writer, cancel-in-progress: false }
    permissions: { contents: write }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: ci-records, path: records, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-records-batch, path: batch }
      - name: Append
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/ci/ci_records.py append --batch batch --records records --repo "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
