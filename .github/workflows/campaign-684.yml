name: campaign-684
run-name: campaign for competemath/tengoku#684 (the Deps.lean marker is not a module to tag)
on:
  push:
    branches: [campaign-684]
permissions: { contents: read }
jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRS: "681 682 683 685 686 687 688 689 690 691 692 693"
      AUTOTAG_ACTORS: "tengoku-intake[bot]"
      TENGOKU_ISNAD_REQUIRED: "1"
      TENGOKU_INTAKE_LINT: "proposed"
    steps:
      - name: The objects of tengoku (main, the fix branch and the intake pull requests), no checkout
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku obj
          cd obj
          for n in $PRS; do git fetch -q origin "+refs/pull/$n/head:refs/remotes/pr/$n"; done
          git fetch -q origin "+refs/pull/684/head:refs/remotes/fix"
          git rev-parse origin/main refs/remotes/fix | tee ../revs.txt
      - name: Two copies of the tooling, main's and the fix's
        run: |
          cd obj
          for v in main fix; do
            rev=origin/main; [ "$v" = fix ] && rev=refs/remotes/fix
            mkdir -p "../tools-$v"
            git archive "$rev" scripts schemas tools | tar -x -C "../tools-$v"
          done
          diff -rq ../tools-main ../tools-fix | tee ../tooling-diff.txt || true
      - name: The planner on every intake pull request, with each copy of the tooling
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          obj = os.path.abspath("obj")
          bad = 0
          for n in os.environ["PRS"].split():
              head = subprocess.run(["git", "rev-parse", f"refs/remotes/pr/{n}"], cwd=obj, capture_output=True, text=True, check=True).stdout.strip()
              base = subprocess.run(["git", "merge-base", "origin/main", head], cwd=obj, capture_output=True, text=True, check=True).stdout.strip()
              out = {}
              for v in ("main", "fix"):
                  env = {**os.environ, "TENGOKU_CI_ROOT": obj}
                  p = subprocess.run([sys.executable, "scripts/ci/autotag.py", "plan", base, head, "tengoku-intake[bot]"], cwd=f"tools-{v}", capture_output=True, text=True, env=env)
                  if p.returncode != 0:
                      print(f"#{n} {v}: planner exited {p.returncode}: {p.stderr[-600:]}"); bad += 1; continue
                  out[v] = json.loads(p.stdout.strip().splitlines()[-1])
              if len(out) < 2: continue
              m, f = out["main"], out["fix"]
              deps_m = [x for x in m["modules"] if x.endswith(".Deps")]
              deps_f = [x for x in f["modules"] if x.endswith(".Deps")]
              extra = sorted(set(m["modules"]) - set(f["modules"]))
              ok = bool(deps_m) and not deps_f and extra == deps_m and len(f["modules"]) == len(m["modules"]) - 1 and not m["refused"] and not f["refused"] and f["lane"] == "intake"
              print(f"#{n}: lane={f['lane']} refused={f['refused']!r}; modules main={len(m['modules'])} fix={len(f['modules'])}; only in main: {extra}; fix still lists a Deps: {deps_f}  ->  {'OK' if ok else 'WRONG'}")
              bad += 0 if ok else 1
          sys.exit(1 if bad else 0)
          PY
      - name: The tool tests that touch the lane (the fix's tooling)
        run: |
          cd tools-fix
          git config --global user.email c@c; git config --global user.name c; git config --global init.defaultBranch main
          cd scripts/ci/tests
          python3 -m unittest test_autotag test_born_tagged 2>&1 | tail -6
          python3 -m unittest discover -s . 2>&1 | tail -6 || true
