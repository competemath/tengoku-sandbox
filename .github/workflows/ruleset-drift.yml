# The repository's rulesets are the ones that were reviewed (docs/ci-records.md, "Ruleset drift"). Read-only: it fetches the live rulesets, compares them with
# the committed snapshots in .github/rulesets/ and fails with a readable diff on any drift, then asserts what must hold on the default branch (a pull-request
# rule with required approvals or the merge queue, required status checks, `non_fast_forward` and `deletion`) and warns about required checks that name no App.
# A ruleset changed in the settings leaves no diff in the repository: this is how the change is noticed. Bypass actors are hidden from a workflow's token
# and are not compared (the summary says so).
#
# A pull request that changes the checker or a snapshot runs it too, which is how a change to a snapshot is proven to match what is live.
name: ruleset-drift
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    paths: [scripts/ci/ruleset_drift.py, ".github/rulesets/**", .github/workflows/ruleset-drift.yml]
permissions: {}
concurrency:
  group: ruleset-drift-${{ github.event_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Live rulesets against the committed ones
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/ci/ruleset_drift.py check --repo "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
