name: lose-runner
# SANDBOX CAMPAIGN ONLY (tengoku#915): a job named like queue-gate's build job that really loses its runner, to see what GitHub reports and to run
# scripts/ci/requeue_lost.py against a real lost-runner run. It exists only on the campaign branch.
on:
  push:
    branches: [campaign/requeue-lost]
permissions: {}
jobs:
  queue-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: before
        run: echo "the runner is about to be killed"
      - name: kill the runner
        run: |
          sudo pkill -9 -f Runner.Listener || true
          sudo pkill -9 -f Runner.Worker || true
          sleep 120
