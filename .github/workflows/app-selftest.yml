# One-off check that the judge App, its installation and its two repository secrets work together. It prints the names of the repositories the
# installation covers and writes one neutral check run on the commit; it prints no secret. Runs on the pull request that adds it; close that pull request
# without merging.
name: app-selftest
on:
  pull_request:
    paths: [".github/workflows/app-selftest.yml"]
permissions: {}
concurrency: { group: "app-selftest-${{ github.ref }}", cancel-in-progress: true }
defaults:
  run:
    shell: bash
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.JUDGE_APP_ID }}
          private-key: ${{ secrets.JUDGE_APP_KEY }}
          owner: competemath
      - name: Who is this token, and may it write a check
        env:
          GH_TOKEN: "${{ steps.app.outputs.token }}"
          SHA: "${{ github.event.pull_request.head.sha }}"
          REPO: "${{ github.repository }}"
        run: |
          echo "repositories the installation covers:"
          gh api /installation/repositories --jq '.repositories[].full_name'
          gh api "repos/$REPO/check-runs" -f name="app-selftest (judge)" -f head_sha="$SHA" -f status=completed -f conclusion=neutral \
            -f 'output[title]=judge App self-test' -f 'output[summary]=The judge App minted a token and wrote this check run.' --jq '"check run written: \(.id)"'
  which-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Which of the four secrets are set in this repository (true or false only)
        env:
          JUDGE_APP_ID_SET: "${{ secrets.JUDGE_APP_ID != '' }}"
          JUDGE_APP_KEY_SET: "${{ secrets.JUDGE_APP_KEY != '' }}"
          INTAKE_APP_ID_SET: "${{ secrets.INTAKE_APP_ID != '' }}"
          INTAKE_APP_KEY_SET: "${{ secrets.INTAKE_APP_KEY != '' }}"
        run: |
          echo "JUDGE_APP_ID=$JUDGE_APP_ID_SET JUDGE_APP_KEY=$JUDGE_APP_KEY_SET INTAKE_APP_ID=$INTAKE_APP_ID_SET INTAKE_APP_KEY=$INTAKE_APP_KEY_SET"
