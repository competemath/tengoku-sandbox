# tengoku-leakscan with REAL Lean on a toy package (scripts/ci/leakscan_fixture): which root-level names it reports as generated by Lean (`root-instance:`, `root-syntax:`) and which
# as written, and what the roots guard (scripts/ci/roots_gate.py) then decides. The unit tests of the guard feed it reports as text; only this runs the scanner that writes them.
# The merge queue is the only CI that builds the tree; this builds the scanner (it imports Lean alone) and two small modules. Seconds, no Mathlib.
name: leakscan-tests
on:
  pull_request:
    paths: [TengokuLeak.lean, scripts/ci/roots_gate.py, "scripts/ci/leakscan_fixture/**", .github/workflows/leakscan-tests.yml, lean-toolchain, lakefile.toml]
  push:
    branches: [probe/roots-generated-names]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Lean toolchain (pinned by lean-toolchain)
        run: |
          # the installer at a fixed commit (as root-inventory.yml), fetched over HTTPS (TLS 1.2 or later) only and checked against its SHA-256 before anything runs
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/elan-init.sh" https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The scanner, as this commit has it
        run: lake build tengoku-leakscan 2>&1 | tail -15
      - name: "The fixture: every root-level line of each report is the expected one"
        run: |
          cp lean-toolchain scripts/ci/leakscan_fixture/
          cd scripts/ci/leakscan_fixture
          lake build 2>&1 | tail -15
          for m in Generated Written; do
            lake env "$GITHUB_WORKSPACE/.lake/build/bin/tengoku-leakscan" --module "Fixture.$m" --prefix "Fixture.$m" > "$RUNNER_TEMP/$m.txt"
            echo "=== Fixture.$m"; cat "$RUNNER_TEMP/$m.txt"
            grep -E '^root(-instance|-syntax)?: ' "$RUNNER_TEMP/$m.txt" | LC_ALL=C sort > "$RUNNER_TEMP/$m.got"
            LC_ALL=C sort "expected/$m.txt" > "$RUNNER_TEMP/$m.want"
            diff "$RUNNER_TEMP/$m.want" "$RUNNER_TEMP/$m.got" || { echo "::error::tengoku-leakscan on Fixture.$m: the root lines differ from scripts/ci/leakscan_fixture/expected/$m.txt (< expected, > reported)"; exit 1; }
          done
      - name: "The guard, required: generated names pass, written names are refused and are the ones it lists"
        env: { TENGOKU_ROOTS_REQUIRED: "1" }
        run: |
          python3 scripts/ci/roots_gate.py < "$RUNNER_TEMP/Generated.txt"
          if python3 scripts/ci/roots_gate.py < "$RUNNER_TEMP/Written.txt" > "$RUNNER_TEMP/verdict.txt"; then
            cat "$RUNNER_TEMP/verdict.txt"; echo "::error::the required guard let a module with written root names through"; exit 1
          fi
          cat "$RUNNER_TEMP/verdict.txt"
          grep -q '^roots: 11 declaration(s) of the group are in the root namespace: ' "$RUNNER_TEMP/verdict.txt" || { echo "::error::the guard did not refuse the eleven written names"; exit 1; }
          for n in instTaggedNat '«termFixture∂»'; do
            head -1 "$RUNNER_TEMP/verdict.txt" | sed 's/ (.*//' | grep -q -F -- "$n" && { echo "::error::the guard lists the generated name $n as a root"; exit 1; }
          done
          echo "the guard refuses the eleven written names and exempts the two generated ones"
