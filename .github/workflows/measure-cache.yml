# One-off measurement (never merged): what the published cache weighs once unpacked, per library and per module, and how long the unpacking takes.
# It decides whether the tree can take lean-pool and tauceti (9.7k more modules) on a runner of 145 GB with 108 GB free.
name: measure-cache
on:
  pull_request:
    paths: [".github/workflows/measure-cache.yml"]
permissions: { contents: read }
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Lean toolchain and zstd
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          df -h / | tail -1
      - name: Unpack the newest cache of the library, timed
        env: { GH_TOKEN: "${{ github.token }}", TENGOKU_CACHE_SOURCE: competemath/tengoku }
        run: |
          df -k / | tail -1 | awk '{print "free before (KB):", $4}'
          start=$(date +%s)
          commit="$(curl -sSfL https://github.com/competemath/tengoku/releases/download/cache-latest/cache-latest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          echo "the published cache is for $commit"
          scripts/cache.sh get "$commit"
          echo "unpack took $(( $(date +%s) - start )) s"
          df -k / | tail -1 | awk '{print "free after (KB):", $4}'
      - name: Weigh it
        run: |
          du -sk .lake/build | awk '{printf "build dir: %.1f GB\n", $1/1048576}'
          for k in lib/lean ir; do [ -d ".lake/build/$k" ] && du -sk ".lake/build/$k" | awk -v k="$k" '{printf "%s: %.1f GB\n", k, $1/1048576}'; done
          n=$(find .lake/build -name '*.olean' | wc -l); echo "olean files: $n"
          find .lake/build -name '*.olean' -printf '%s\n' | awk '{s+=$1} END {printf "olean total: %.1f GB, mean %.0f KB\n", s/1073741824, s/NR/1024}'
          for t in .lake/build/lib/lean/Tengoku/*/; do
            b=$(basename "$t"); m=$(find "$t" -name '*.olean' | wc -l); s=$(find "$t" -name '*.olean' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
            [ "$m" -gt 0 ] && echo "$b $m $s"
          done | sort -k3 -n -r | awk '{printf "%-36s %6d modules %8.0f MB  %6.0f KB/module\n", $1, $2, $3/1048576, $3/$2/1024}' | head -40
          du -sk .lake/build/ir 2>/dev/null | awk '{printf "ir (C files): %.1f GB\n", $1/1048576}'
          df -h / | tail -1
