name: diag-tag2
run-name: "diagnose why the tagger leaves azurite's UInt64.Equiv.Basic untagged (tengoku#681)"
on:
  push:
    branches: [diag-tag2]
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TENGOKU_CACHE_SOURCE: competemath/tengoku
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda || true
          df -h / | tail -1
      - name: The PR's tree (tengoku PR 681 head)
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tree
          cd tree
          git fetch -q origin "+refs/pull/681/head:refs/remotes/pr/681"
          git checkout -q --detach refs/remotes/pr/681
          git log --oneline -1
      - name: elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The compiled tree (the library's cache)
        run: cd tree && scripts/cache.sh get 2>&1 | tail -3
      - name: Build the tree with the PR's modules, and the tagger
        run: |
          cd tree
          lake build Tengoku.All 2>&1 | tail -2
          lake build tengoku-isnad 2>&1 | tail -1
      - name: Which module declares the name, and what the tagger's Lean side records for it
        run: |
          cd tree
          cat > /tmp/Probe.lean <<'LEAN'
          import Tengoku.Azurite.Azurite.UInt64.Equiv.Basic
          open Lean in
          #eval show CoreM Unit from do
            let env ← getEnv
            let n := `UInt64.eq_of_toNat_eq
            IO.println s!"declared: {env.contains n}; module idx: {env.getModuleIdxFor? n}"
            match env.getModuleIdxFor? n with
            | some i => IO.println s!"module: {env.header.moduleNames[i.toNat]!}"
            | none => IO.println "declared in the importing module itself"
          LEAN
          sed -i 's/^          //' /tmp/Probe.lean
          lake env lean /tmp/Probe.lean 2>&1 | tail -8
          echo "--- the tagger's Lean side for the module"
          lake env .lake/build/bin/tengoku-isnad --module Tengoku.Azurite.Azurite.UInt64.Equiv.Basic 2>&1 | head -10
      - name: After tagging the whole PR (written), which modules the gate would still refuse
        run: |
          cd tree
          mods=(); while read -r m; do mods+=(--module "$m"); done < <(git ls-tree -r --name-only HEAD Tengoku/Azurite | grep '\.lean$' | sed -E 's#/#.#g; s#\.lean$##' | grep -v '\.Deps$')
          python3 scripts/isnad.py tag "${mods[@]}" --write 2>&1 | tail -1
          cd scripts/ci && python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, ".")
          from born_tagged import module_errors
          bad = []
          for p in subprocess.run(["git", "ls-files", "Tengoku/Azurite"], cwd="../..", capture_output=True, text=True).stdout.split():
              if not p.endswith(".lean") or p.endswith("/Deps.lean") or p.count("/") < 2: continue
              t = open("../../" + p).read()
              e = module_errors(p, t)
              if e: bad.append(p)
          print("modules the gate would still refuse after tagging:", len(bad))
          for p in bad[:40]: print("  ", p)
          PY
