# THROWAWAY RUN BRANCH (never merged): the stage -> pack -> unstage cycle of Lake's artifact cache on a one-module group (quick check, ~15 min).
name: build
on: { workflow_dispatch: {} }
permissions: {}
defaults: { run: { shell: bash } }
env:
  TENGOKU_REPO: ${{ github.repository }}
  TENGOKU_VERIFY: require
  TENGOKU_TOPUPS: "1"
  LAKE_ARTIFACT_CACHE: "true"
  LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Lean toolchain and zstd
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
      - name: Seed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/cache.sh get 2>&1 | tail -2
      - name: "The base: the closure of Tengoku.Pfr (stands in for the nightly's base.jsonl)"
        run: |
          start=$(date +%s); lake build Tengoku.Pfr -o base.jsonl > b.log 2>&1; tail -1 b.log
          echo "took $(( $(date +%s) - start )) s; base mappings $(wc -l < base.jsonl); header line: $(head -1 base.jsonl | cut -c1-120)"
      - name: A one-module group on top; stage ONLY its own mapping (header kept)
        run: |
          mkdir -p Tengoku/Probe && printf 'import Tengoku.Pfr\n\ntheorem Tengoku.Probe.hello : 1 + 1 = 2 := rfl\n' > Tengoku/Probe/Hello.lean
          lake build Tengoku.Probe.Hello -o out.jsonl 2>&1 | tail -2
          python3 - <<'PY'
          rows = [l.rstrip("\n") for l in open("out.jsonl") if l.strip()]
          head, mine = rows[0], rows[1:]
          had = set(l.strip() for l in open("base.jsonl") if l.strip())
          new = [l for l in mine if l not in had]
          open("out-new.jsonl", "w").write("".join(l + "\n" for l in [head] + new))
          print(f"header kept; build's mappings {len(mine)}; known {len(mine) - len(new)}; new {len(new)}")
          PY
          lake cache stage out-new.jsonl stage 2>&1 | tail -2
          echo "staged: $(find stage -type f | wc -l) files, $(du -sh stage | cut -f1)"; find stage -type f | head -8
          tar -c -C stage . | zstd -T0 -3 -q -o d-1.tar.zst; echo "delta: $(du -h d-1.tar.zst | cut -f1)"
      - name: Lose the group's build and the whole local cache; restore from the delta alone; --no-build must pass
        run: |
          rm -rf .lake/build/lib/lean/Tengoku/Probe .lake/build/ir/Tengoku/Probe .lake/cache stage
          if lake build Tengoku.Probe.Hello --no-build >/dev/null 2>&1; then echo "::error::built without the delta?"; exit 1; else echo "control: refused without the delta, as expected"; fi
          mkdir d1 && zstd -dc d-1.tar.zst | tar -x -C d1 && lake cache unstage d1 2>&1 | tail -2
          start=$(date +%s); lake build Tengoku.Probe.Hello --no-build -v 2>&1 | tail -3
          echo "restored from the delta with --no-build in $(( $(date +%s) - start )) s"; ls -la .lake/build/lib/lean/Tengoku/Probe/ | head -5
