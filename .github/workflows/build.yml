      - name: "A fresh runner restores every group from the store"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          start=$(date +%s)
          n=$(( ${{ github.event.inputs.parts || '3' }} ))
          for j in $(seq 1 $n); do
            gh release download "$SCOPE" -R "$GITHUB_REPOSITORY" -p "d-$j.tar.zst"
            mkdir "d-$j" && zstd -dc "d-$j.tar.zst" | tar -x -C "d-$j" && rm "d-$j.tar.zst"
            lake cache unstage "d-$j" 2>&1 | tail -1
            gh release download oai-test-parts -R "$GITHUB_REPOSITORY" -p "oai-part-0$j.tar"
            tar -xf "oai-part-0$j.tar" --exclude manifest.jsonl --exclude report.json
          done
          echo "restored $n deltas in $(( $(date +%s) - start )) s; local cache $(du -sh "$LAKE_CACHE_DIR" | cut -f1); disk: $(df -h / | tail -1)"
      - name: "lake build <every module of every group> --no-build: all of them come from the store, none is compiled"
        run: |
          start=$(date +%s)
          n=$(( ${{ github.event.inputs.parts || '3' }} ))
          : > allmods.txt
          for j in $(seq 1 $n); do
            tar -tf "oai-part-0$j.tar" | grep '^Tengoku/OpenaiMath/.*\.lean$' | sed 's/\.lean$//; s|/|.|g' >> allmods.txt || true
          done
          sort -u allmods.txt -o allmods.txt
          echo "restoring $(wc -l < allmods.txt) modules of $n group(s)"
          lake build $(cat allmods.txt) --no-build > verify.log 2>&1 && ok=1 || ok=0
          tail -3 verify.log
          echo "result ok=$ok in $(( $(date +%s) - start )) s"
          test "$ok" = 1
      - name: "The umbrella (the only module no group built) compiles from the restored modules in seconds, nothing else compiles"
        if: ${{ fromJSON(github.event.inputs.parts || '3') == 9 }}
        run: |
          lake build Tengoku.OpenaiMath > umb.log 2>&1; tail -2 umb.log
          echo "compiled: $(grep -c ' Built ' umb.log)"; test "$(grep -c ' Built ' umb.log)" = 1
      - name: Delete the throwaway store
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete "$SCOPE" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
