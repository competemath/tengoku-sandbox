          done
          echo "restored 1 earlier group(s) in $(( $(date +%s) - start )) s; known mappings: $(wc -l < had.jsonl); local cache: $(du -sh "$LAKE_CACHE_DIR" 2>/dev/null | cut -f1)"
      - name: "This group's sources: parts 1..2 (module files only)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for j in $(seq 1 2); do
            gh release download oai-test-parts -R "$GITHUB_REPOSITORY" -p "oai-part-0$j.tar"
            tar -xf "oai-part-0$j.tar" --exclude 'Tengoku/OpenaiMath.lean' --exclude manifest.jsonl --exclude report.json
          done
