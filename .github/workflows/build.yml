# The PR's own lint and test suite. Unlike pr-gate.yml this runs the PR's code, which is the point:
# it tests the change itself. It decides nothing about policy (a PR can edit this file, its tests and
# its pre-commit config), and runs with a read-only token and no secrets. Tooling PRs, the ones whose
# code it tests, always wait for a maintainer's merge.
name: build
on: { workflow_dispatch: {} }
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, filter: "blob:none", persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -q --require-hashes -r scripts/ci/requirements/yaml.txt
      - shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -v > t1.log 2>&1; echo "scripts/tests exit $?"
          grep -E "^(FAIL|ERROR): |^Ran |^FAILED|^OK" t1.log | head -40
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v > t2.log 2>&1; echo "scripts/ci/tests exit $?"
          grep -E "^(FAIL|ERROR): |^Ran |^FAILED|^OK" t2.log | head -40
