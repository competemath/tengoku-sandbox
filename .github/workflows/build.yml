# THROWAWAY RUN BRANCH (never merged): what disks does a hosted runner have, and how much is free after the usual clean-up?
name: build
on: { workflow_dispatch: {} }
permissions: {}
jobs:
  disks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - name: Before and after the usual clean-up
        run: |
          echo "== before"; df -h / /mnt 2>&1; lsblk 2>&1 | head -12
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          echo "== after"; df -h / /mnt 2>&1
          echo "== /mnt ownership and a write test"; ls -ld /mnt; sudo mkdir -p /mnt/probe && sudo chown "$(id -un):$(id -gn)" /mnt/probe && ln -sfn /mnt/probe "$PWD/.lake" && mkdir -p .lake/build && dd if=/dev/zero of=.lake/build/blob bs=1M count=2048 status=none && ln .lake/build/blob .lake/build/blob2 && echo "wrote 2 GB through the symlink, hard link ok, .lake -> $(readlink .lake)"; df -h / /mnt | tail -2
