# THROWAWAY RUN BRANCH (never merged): the Lake artifact cache over a chain of real groups, store = a GitHub release (free).
# Group k = part k of the openai-math bundle (sandbox test release oai-test-parts). Success = every group compiles exactly its own modules,
# the next group restores the earlier ones from deltas (0 recompiled), and a fresh runner restores all of them with `lake build --no-build`.
name: build
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "how many parts to chain (1-9)"
        required: false
        default: "3"
concurrency:
  group: lake-chain
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  TENGOKU_REPO: ${{ github.repository }}
  TENGOKU_VERIFY: require
  TENGOKU_TOPUPS: "1"
  LAKE_ARTIFACT_CACHE: "true"
  LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
  SCOPE: lake-chain-${{ github.run_id }}
jobs:
  g0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: Lean toolchain (pinned by lean-toolchain) and zstd
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1
      - name: Seed from the newest published cache (the nightly tarball stays the bulk seed)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          start=$(date +%s)
          scripts/cache.sh get 2>&1 | tail -3
          echo "seed took $(( $(date +%s) - start )) s"; { df -h / | tail -1; du -sh .lake/build; } | sed 's/^/after seeding: /'
      - name: "The base's mappings (the nightly would publish this file next to its tarball)"
        run: |
          start=$(date +%s)
          lake build Tengoku.All -o base.jsonl > build0.log 2>&1 || { tail -20 build0.log; exit 1; }
          echo "compiled: $(grep -c ' Built ' build0.log || true) modules; took $(( $(date +%s) - start )) s; base mappings: $(wc -l < base.jsonl) lines, $(du -h base.jsonl | cut -f1)"
      - name: The store (a release named by the scope) and the base mappings in it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$SCOPE" -R "$GITHUB_REPOSITORY" --title "lake cache chain $GITHUB_RUN_ID (throwaway)" --notes "deleted by the run that made it" --prerelease --target "$GITHUB_SHA"
          gh release upload "$SCOPE" base.jsonl -R "$GITHUB_REPOSITORY"
  g1:
    needs: g0
    if: ${{ fromJSON(github.event.inputs.parts || '3') >= 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: Lean toolchain (pinned by lean-toolchain) and zstd
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1
      - name: Seed from the newest published cache (the nightly tarball stays the bulk seed)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          start=$(date +%s)
          scripts/cache.sh get 2>&1 | tail -3
          echo "seed took $(( $(date +%s) - start )) s"; { df -h / | tail -1; du -sh .lake/build; } | sed 's/^/after seeding: /'
      - name: "Restore the earlier groups: their deltas from the store, lake cache unstage"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          start=$(date +%s)
          gh release download "$SCOPE" -R "$GITHUB_REPOSITORY" -p base.jsonl
          cp base.jsonl had.jsonl
          for j in $(seq 1 0); do
            gh release download "$SCOPE" -R "$GITHUB_REPOSITORY" -p "d-$j.tar.zst"
            mkdir "d-$j" && zstd -dc "d-$j.tar.zst" | tar -x -C "d-$j" && rm "d-$j.tar.zst"
            lake cache unstage "d-$j" 2>&1 | tail -1
            cat "d-$j/outputs.jsonl" >> had.jsonl
          done
          echo "restored 0 earlier group(s) in $(( $(date +%s) - start )) s; known mappings: $(wc -l < had.jsonl); local cache: $(du -sh "$LAKE_CACHE_DIR" 2>/dev/null | cut -f1)"
      - name: "This group's sources: parts 1..1 (module files only)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for j in $(seq 1 1); do
            gh release download oai-test-parts -R "$GITHUB_REPOSITORY" -p "oai-part-0$j.tar"
            tar -xf "oai-part-0$j.tar" --exclude 'Tengoku/OpenaiMath.lean' --exclude manifest.jsonl --exclude report.json
          done
          tar -tf oai-part-01.tar | grep '^Tengoku/OpenaiMath/.*\.lean$' | sed 's/\.lean$//; s|/|.|g' | sort > mods.txt
          echo "this group: $(wc -l < mods.txt) modules; sources in the tree now: $(find Tengoku/OpenaiMath -name '*.lean' | wc -l)"
      - name: "Compile this group ONLY (lake build <its modules> -o): anything else compiled is a cache miss"
        run: |
          start=$(date +%s)
          set +e; lake build $(cat mods.txt) -o out.jsonl > build.log 2>&1; status=$?; set -e
          tail -3 build.log
          compiled=$(grep -E ' Built ' build.log | sed -E 's/.*Built ([^ ]+).*/\1/' | sort -u); echo "$compiled" > built.txt
          echo "status $status; compiled $(wc -l < built.txt) module(s) in $(( $(date +%s) - start )) s; its build's mappings: $(wc -l < out.jsonl) lines"
          foreign=$(comm -13 mods.txt built.txt | wc -l); echo "compiled but not of this group (cache misses): $foreign"; comm -13 mods.txt built.txt | head -5
          grep -E "^error:|declaration uses .sorry." build.log | head -8 || true
          test "$status" = 0
          test "$foreign" = 0
      - name: "Stage this group's OWN new mappings, pack ONE delta, publish it"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          had = set(l.strip() for l in open("had.jsonl") if l.strip())
          rows = [l.rstrip("\n") for l in open("out.jsonl") if l.strip()]
          head, mine = rows[0], rows[1:]   # the first line is the file's header (schema version): Lake refuses a mappings file without it
          new = [l for l in mine if l not in had]
          open("out-new.jsonl", "w").write("".join(l + "\n" for l in [head] + new))
          print(f"mappings of this build: {len(mine)}; already known: {len(mine) - len(new)}; new (this group's own): {len(new)}")
          PY
          test "$(wc -l < out-new.jsonl)" -gt 1
          start=$(date +%s)
          lake cache stage out-new.jsonl stage 2>&1 | tail -2
          echo "staged: $(find stage -type f | wc -l) files, $(du -sh stage | cut -f1) (first: $(ls stage | head -3 | tr '\n' ' '))"
          tar -c -C stage . | zstd -T0 -3 -q -o d-1.tar.zst
          echo "delta d-1.tar.zst: $(du -h d-1.tar.zst | cut -f1); packed in $(( $(date +%s) - start )) s"
          start=$(date +%s)
          gh release upload "$SCOPE" d-1.tar.zst -R "$GITHUB_REPOSITORY"
          echo "uploaded in $(( $(date +%s) - start )) s"
  g2:
    needs: g1
    if: ${{ fromJSON(github.event.inputs.parts || '3') >= 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: { contents: write }
