# THROWAWAY RUN BRANCH (never merged): what is in the compiled tree's .lake/build by file type (sandbox tree, same structure as the library's)
name: build
on: { workflow_dispatch: {} }
permissions: {}
defaults: { run: { shell: bash } }
env: { TENGOKU_REPO: "${{ github.repository }}", TENGOKU_VERIFY: require, TENGOKU_TOPUPS: "0" }
jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          scripts/cache.sh get 2>&1 | tail -2
          du -sk .lake/build/* | awk '{printf "%7.2f GB  %s\n", $1/1048576, $2}'
          echo "== bytes by file extension (the last two suffixes, e.g. c.o.export), top 15"
          find .lake/build -type f -printf '%s %f\n' | awk '{n=split($2,a,"."); ext=(n>=3 ? a[n-1]"."a[n] : (n==2 ? a[n] : "none")); if ($2 ~ /\.(a|so|dylib)$/) ext="archive:" a[n]; s[ext]+=$1; c[ext]++} END {for (e in s) printf "%9.2f GB %9d files  .%s\n", s[e]/1073741824, c[e], e}' | sort -rn | head -15
          echo "== the biggest single files"; find .lake/build -type f -printf '%s %p\n' | sort -rn | head -5 | awk '{printf "%7.2f GB  %s\n", $1/1073741824, $2}'
          echo "== the lakefile's lean_lib and default facets"; grep -n "defaultFacets\|precompile\|moreLeanArgs\|moreLeancArgs\|buildType\|lean_lib" lakefile.toml
          lake --version
