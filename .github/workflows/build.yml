# THROWAWAY RUN BRANCH (never merged): round trip of Lake's artifact cache with GITHUB RELEASES as the store (free, CDN-served).
# Lake's cache machinery is unchanged: it looks mappings up by git revision (backtracking to the parent for a merge-group commit),
# verifies every download against its content hash and fetches artifacts lazily. Only the upload is ours: `gh release upload` of the
# files `lake cache stage` lays out. The nightly tarball stays the bulk seed; the release carries just the merges since.
name: build
on:
  workflow_dispatch:
    inputs:
      target:
        description: "an existing module the probe module imports"
        required: false
        default: "Tengoku.Pfr"
permissions: {}
defaults:
  run:
    shell: bash
env:
  TENGOKU_REPO: ${{ github.repository }}
  TENGOKU_VERIFY: require
  TENGOKU_TOPUPS: "1"
  LAKE_ARTIFACT_CACHE: "true"
  # Lake's S3-kind endpoints, pointed at this repository's release downloads: an artifact is <endpoint>/<scope>/<hash>.art and the
  # mappings of a revision <endpoint>/<scope>/<rev>.jsonl, so the scope is a release tag and every file an asset of it
  LAKE_CACHE_ARTIFACT_ENDPOINT: https://github.com/${{ github.repository }}/releases/download
  LAKE_CACHE_REVISION_ENDPOINT: https://github.com/${{ github.repository }}/releases/download
  SCOPE: lake-rt-${{ github.run_id }}
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions: { contents: write }   # the throwaway release; deleted at the end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: Lean toolchain (pinned by lean-toolchain) and zstd
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1
      - name: Seed from the newest published cache (the nightly tarball stays the bulk seed)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          scripts/cache.sh get 2>&1 | tail -3
          { df -h / | tail -1; du -sh .lake/build; } | sed 's/^/after seeding: /'
      - name: "1. The base's full mappings: lake build Tengoku.All -o (cache on)"
        env: { LAKE_CACHE_DIR: "${{ github.workspace }}/.lake/cache" }
        run: |
          start=$(date +%s)
          lake build Tengoku.All -o out-all.jsonl > build1.log 2>&1 || { tail -20 build1.log; exit 1; }
          echo "compiled: $(grep -c 'Built ' build1.log || true) modules; took $(( $(date +%s) - start )) s; mappings: $(wc -l < out-all.jsonl) lines, $(du -h out-all.jsonl | cut -f1)"
          du -sh .lake/build .lake/cache; df -h / | tail -1
      - name: "2. The store: a release named by the scope; the base's mappings as <base-sha>.jsonl"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$SCOPE" -R "$GITHUB_REPOSITORY" --title "lake cache round trip $GITHUB_RUN_ID (throwaway)" --notes "deleted by the run that made it" --prerelease --target "$GITHUB_SHA"
          cp out-all.jsonl "$GITHUB_SHA.jsonl" && gh release upload "$SCOPE" "$GITHUB_SHA.jsonl" -R "$GITHUB_REPOSITORY"
          echo "the revision file is served at: $LAKE_CACHE_REVISION_ENDPOINT/$SCOPE/$GITHUB_SHA.jsonl"
          curl -sfL -o /dev/null -w "GET %{http_code} after %{num_redirects} redirect(s), %{size_download} bytes\n" "$LAKE_CACHE_REVISION_ENDPOINT/$SCOPE/$GITHUB_SHA.jsonl"
      - name: "3. A group on top: build it, stage ONLY its own new mappings, upload them with gh"
        env: { GH_TOKEN: "${{ github.token }}", TARGET: "${{ github.event.inputs.target }}", LAKE_CACHE_DIR: "${{ github.workspace }}/.lake/cache" }
        run: |
          mkdir -p Tengoku/Probe && printf 'import %s\n\ntheorem Tengoku.Probe.hello : 1 + 1 = 2 := rfl\n' "$TARGET" > Tengoku/Probe/Hello.lean
          git -c user.name=probe -c user.email=probe@example.invalid add -A && git -c user.name=probe -c user.email=probe@example.invalid commit -qm "a group on top"
          rev="$(git rev-parse HEAD)"; echo "group commit $rev"
          start=$(date +%s)
          lake build Tengoku.Probe.Hello -o out-probe.jsonl 2>&1 | tail -2
          echo "the group built in $(( $(date +%s) - start )) s; its build's mappings: $(wc -l < out-probe.jsonl) lines"
          python3 - <<'PY'
          base = set(l.strip() for l in open("out-all.jsonl") if l.strip())
          mine = [l.strip() for l in open("out-probe.jsonl") if l.strip()]
          new = [l for l in mine if l not in base]
          open("out-new.jsonl", "w").write("".join(l + "\n" for l in new))
          print(f"already in the base: {len(mine) - len(new)}; new (the group's own): {len(new)}")
          PY
          lake cache stage out-new.jsonl staging 2>&1 | tail -1
          echo "staged: $(find staging -type f | wc -l) files, $(du -sh staging | cut -f1)"; ls staging | head -5
          # the upload: every staged artifact, and the group's mappings under its revision; the whole revision's mappings (base + new) so a
          # consumer that finds this revision needs no second file
          cat out-all.jsonl out-new.jsonl > "$rev.jsonl"
          start=$(date +%s)
          find staging -name '*.art' -print0 | xargs -0 -n 20 -P 4 gh release upload "$SCOPE" -R "$GITHUB_REPOSITORY" --clobber
          gh release upload "$SCOPE" "$rev.jsonl" -R "$GITHUB_REPOSITORY" --clobber
          echo "uploaded in $(( $(date +%s) - start )) s"
          echo "rev=$rev" >> "$GITHUB_ENV"
      - name: "4. A fresh runner's view: tarball seed + lake cache get (mappings only) + lake build --no-build; the artifact comes from the release"
        env: { GH_TOKEN: "${{ github.token }}", LAKE_CACHE_DIR: "${{ runner.temp }}/cache2" }
        run: |
          git clone -q --filter=blob:none "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ws2" && cd "$RUNNER_TEMP/ws2"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY"   # cache.sh wants the real origin for the ancestor check of the cache
          test "$(git rev-parse HEAD)" = "$rev"
          scripts/cache.sh get 2>&1 | tail -2
          start=$(date +%s)
          lake cache get --scope "$SCOPE" --mappings-only 2>&1 | tail -4
          echo "get (mappings only) took $(( $(date +%s) - start )) s"
          start=$(date +%s)
          lake build Tengoku.Probe.Hello --no-build -v 2>&1 | grep -iE "download|fetch|Built|error|no-build" | head -6
          echo "--no-build with the artifact fetched lazily from the release: ok, took $(( $(date +%s) - start )) s"
          ls -la .lake/build/lib/lean/Tengoku/Probe/ 2>/dev/null | head -4
      - name: "5. The merge-group case: a commit on top has no mappings; Lake backtracks to the parent"
        env: { GH_TOKEN: "${{ github.token }}", LAKE_CACHE_DIR: "${{ runner.temp }}/cache2" }
        run: |
          cd "$RUNNER_TEMP/ws2"
          echo "touched" >> README.md && git -c user.name=probe -c user.email=probe@example.invalid commit -qam "the next group"
          lake cache get --scope "$SCOPE" --mappings-only 2>&1 | tail -3
          rm -rf .lake/build/lib/lean/Tengoku/Probe   # make Lake need the artifact again
          lake build Tengoku.Probe.Hello --no-build 2>&1 | tail -1 && echo "backtrack to the parent's mappings: ok"
      - name: "6. Control: a scope with no release must not build with --no-build"
        env: { LAKE_CACHE_DIR: "${{ runner.temp }}/cache3" }
        run: |
          cd "$RUNNER_TEMP/ws2"; rm -rf .lake/build/lib/lean/Tengoku/Probe
          if lake cache get --scope "lake-rt-bogus" --mappings-only >/dev/null 2>&1 && lake build Tengoku.Probe.Hello --no-build >/dev/null 2>&1; then echo "::error::built with no store?"; exit 1; else echo "refused as expected"; fi
      - name: Delete the throwaway release
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete "$SCOPE" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
