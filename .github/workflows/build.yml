# THROWAWAY RUN BRANCH (never merged): can the per-module *.setup.json files (80% of .lake/build) be left out of the cache? Delete them from a seeded
# tree and see whether Lake compiles anything, whether `--no-build` still passes, and whether it writes them back.
name: build
on: { workflow_dispatch: {} }
permissions: {}
defaults: { run: { shell: bash } }
env: { TENGOKU_REPO: "${{ github.repository }}", TENGOKU_VERIFY: require, TENGOKU_TOPUPS: "0" }
jobs:
  setup-json:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          scripts/cache.sh get 2>&1 | tail -2
          lake --version
          n=$(find .lake/build -name '*.setup.json' | wc -l); echo "setup.json files: $n; build dir $(du -sh .lake/build | cut -f1); free $(df -h / | tail -1 | awk '{print $4}')"
      - name: "1. Delete every *.setup.json; does `lake build Tengoku.All --no-build` pass?"
        run: |
          find .lake/build -name '*.setup.json' -delete
          echo "after deleting: build dir $(du -sh .lake/build | cut -f1); free $(df -h / | tail -1 | awk '{print $4}')"
          start=$(date +%s)
          if lake build Tengoku.All --no-build > nb.log 2>&1; then echo "--no-build: PASSED in $(( $(date +%s) - start )) s"; else echo "--no-build: FAILED in $(( $(date +%s) - start )) s"; tail -6 nb.log; fi
          echo "setup.json files after --no-build: $(find .lake/build -name '*.setup.json' | wc -l)"
      - name: "2. A normal build over the tree without them: what is compiled, what is written back?"
        run: |
          start=$(date +%s)
          lake build Tengoku.All > b.log 2>&1; echo "status $?"; tail -2 b.log
          echo "compiled (Built): $(grep -c ' Built ' b.log)  replayed: $(grep -c 'Replayed' b.log)  took $(( $(date +%s) - start )) s"
          echo "setup.json files written back: $(find .lake/build -name '*.setup.json' | wc -l); build dir $(du -sh .lake/build | cut -f1); free $(df -h / | tail -1 | awk '{print $4}')"
          grep -E ' Built ' b.log | head -3
      - name: "3. And a module that must compile (touch one) with its setup.json missing"
        run: |
          f="$(find Tengoku -name '*.lean' | grep -v '/Seed/' | head -1)"; m="$(echo "${f%.lean}" | tr / .)"; echo "module $m"
          printf '\n-- probe\n' >> "$f"
          find .lake/build -name '*.setup.json' -delete
          lake build "$m" 2>&1 | tail -3
