          PY
          test "$(wc -l < out-new.jsonl)" -gt 1
          start=$(date +%s)
          lake cache stage out-new.jsonl stage 2>&1 | tail -2
          echo "staged: $(find stage -type f | wc -l) files, $(du -sh stage | cut -f1) (first: $(ls stage | head -3 | tr '\n' ' '))"
          tar -c -C stage . | zstd -T0 -3 -q -o d-2.tar.zst
          echo "delta d-2.tar.zst: $(du -h d-2.tar.zst | cut -f1); packed in $(( $(date +%s) - start )) s"
          start=$(date +%s)
          gh release upload "$SCOPE" d-2.tar.zst -R "$GITHUB_REPOSITORY"
          echo "uploaded in $(( $(date +%s) - start )) s"
  g3:
