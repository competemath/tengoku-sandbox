# Builds the Tengoku tree and publishes the compiled cache to this repository's
# releases (tag `cache-<sha>`), so nobody — human, Leak service, or CI — has to
# compile the tree from scratch. `scripts/cache.sh get` fetches it.
#
# Trusted := it is in the tree and this build finishes with no errors and no
# `sorry`. Warnings are reported, not fatal (linters are style, not truth).
#
# The one-time seed build is hours of compile; GitHub-hosted jobs are capped at
# 6 hours, so the build is RESUMABLE: whatever was compiled is saved to the
# Actions cache even when the job runs out of time, and the workflow re-triggers
# itself until the whole tree is built. After that, incremental builds finish in
# minutes and every push to main publishes a fresh cache.
name: build

on:
  # Nightly only (like Mathlib's cache): a push to main never rebuilds or
  # republishes the cache, so a bad commit has a grace period before it can
  # reach a published cache. `workflow_dispatch` is for a deliberate manual
  # run and for the build's own continuation of an unfinished run.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      resume:
        description: "internal: continuation of an unfinished build"
        required: false
        default: "false"
      retried:
        description: "internal: how many times this build has re-run on the tip after workflow files changed on main (max 2)"
        required: false
        default: "0"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash   # -e -o pipefail on every run: step (the campaign found silent passes behind pipes)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write      # release assets (the cache)
      id-token: write      # Sigstore signing identity for the attestation
      attestations: write
      actions: write       # the run re-dispatches itself (resume after the time cap; publish from the tip) — found by the campaign
    env:
      TENGOKU_REPO: ${{ github.repository }}     # publish here
      TENGOKU_CACHE_SOURCE: competemath/tengoku  # seed from the library (a sandbox has no caches of its own)
    outputs:
      complete: ${{ steps.build.outputs.complete }}
      published: ${{ steps.publish.outputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Free disk space (the tree's build is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Restore whatever earlier jobs compiled: exact tree first, then any
      # earlier state of this branch (Lake rebuilds only what differs).
      - name: Restore partial build
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: lake-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('lean-toolchain') }}-

      - name: Tools for the cache (zstd)
        run: sudo apt-get install -y -q zstd >/dev/null

      - name: Seed from the last published cache (if any)
        if: ${{ github.event.inputs.resume != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cache.sh get || echo "no published cache yet — building from source"

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          # Leave headroom before the job cap so the cache-save step always runs.
          if timeout 320m lake build 2>&1 | tee build.log | grep -E "^(✖|error:)|declaration uses .sorry." ; then :; fi
          status=${PIPESTATUS[0]}
          if grep -q "declaration uses \`sorry\`" build.log; then
            echo "::error::a trusted module uses sorry — refusing"; exit 1
          fi
          if [ "$status" = "124" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"; echo "::warning::time cap reached; progress saved, continuing in a follow-up run"
          elif [ "$status" != "0" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"; echo "::error::build failed"; exit 1
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save partial/complete build
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .lake/build
          key: lake-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}-${{ github.run_attempt }}-${{ github.run_id }}

      # GITHUB_TOKEN may not create a release (a tag) on a commit whose .github/workflows differ
      # from main's tip: GitHub treats it as a workflow change and the job token can never hold
      # `workflows`. A long build during which a workflow PR merged would fail at publish, so
      # the run re-launches itself on the tip instead (the saved build makes that a short run).
      - name: Did a workflow file land on main during this build?
        if: steps.build.outputs.complete == 'true'
        id: guard
        run: |
          git fetch -q origin main
          if git diff --quiet "$GITHUB_SHA" origin/main -- .github/workflows; then echo "stale=false" >> "$GITHUB_OUTPUT"
          else echo "stale=true" >> "$GITHUB_OUTPUT"; echo "::warning::.github/workflows changed on main since $GITHUB_SHA; publishing from a run on the tip instead"; fi

      - name: Publish cache to releases
        if: steps.build.outputs.complete == 'true' && steps.guard.outputs.stale != 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/cache.sh put | tee put.log
          tag="$(grep -oE 'published cache-[0-9A-Z]+' put.log | awk '{print $2}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p attest && gh release download "$tag" -R "$TENGOKU_REPO" -D attest -p 'tengoku-cache.tar.zst.part-*'

      # Every part gets a build-provenance attestation; scripts/cache.sh get refuses parts without one.
      - name: Attest the cache parts
        if: steps.build.outputs.complete == 'true' && steps.guard.outputs.stale != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: attest/tengoku-cache.tar.zst.part-*

      - name: Continue the build in a follow-up run
        if: steps.build.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f resume=true

      - name: Publish from a run on the tip (once)
        if: steps.build.outputs.complete == 'true' && steps.guard.outputs.stale == 'true' && github.event.inputs.retried != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRIED: ${{ github.event.inputs.retried || '0' }}
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f retried="$(( ${RETRIED:-0} + 1 ))"

  # A fresh cache is out: move the hosted Leak services onto it. With an
  # HF_TOKEN secret (a Hugging Face token with write access to the Spaces) each
  # Space is factory-rebuilt, which bakes the new cache into its image so every
  # later wake-up is fast. Without the token, each running Space is asked to
  # refresh itself in place (POST /refresh: it pins to the newest cache and
  # restarts its resident Lean); a sleeping Space is unreachable and instead
  # refreshes itself the next time it starts. Nightly only, never on push.
  notify:
    needs: build
    if: needs.build.outputs.published == 'true' && github.repository == 'competemath/tengoku'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACES: BarkingTree/Leak-I BarkingTree/Leak-II BarkingTree/Leak-IV
    steps:
      - name: Move the Leak Spaces onto the new cache
        run: |
          for space in $SPACES; do
            host="$(echo "$space" | tr '/A-Z' '-a-z').hf.space"
            if [ -n "$HF_TOKEN" ]; then
              if curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $HF_TOKEN" \
                   "https://huggingface.co/api/spaces/$space/restart?factory=true"; then
                echo "$space: factory rebuild requested (bakes the new cache into the image)"
              else
                echo "::warning::$space: rebuild request failed; it refreshes itself on its next start"
              fi
            else
              if out="$(curl -fsS -m 30 -X POST "https://$host/refresh" 2>/dev/null)"; then
                echo "$space: $out"
              else
                echo "$space: not reachable (asleep?) — it refreshes itself on its next start"
              fi
            fi
          done
