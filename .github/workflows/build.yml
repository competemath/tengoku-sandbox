          cp base.jsonl had.jsonl
          for j in $(seq 1 1); do
            gh release download "$SCOPE" -R "$GITHUB_REPOSITORY" -p "d-$j.tar.zst"
            mkdir "d-$j" && zstd -dc "d-$j.tar.zst" | tar -x -C "d-$j" && rm "d-$j.tar.zst"
            lake cache unstage "d-$j" 2>&1 | tail -1
