name: scenario
# a workflow that never runs (dispatch only): it exists to be judged by the gate's workflow rules
on: pull_request_target
permissions: {}
jobs:
  a:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: git fetch -q origin "+refs/pull/1/head:pr-head" && git checkout -q pr-head -- scripts
