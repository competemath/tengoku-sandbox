name: ic-dev
run-name: "development run of the sharded independent check (graph, plan, three shards measured)"
on:
  push:
    branches: [ic-dev]
permissions: { contents: read }
jobs:
  dev:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TENGOKU_CACHE_SOURCE: competemath/tengoku
      LEAN4EXPORT_COMMIT: 483e011449cce37c3f8ad5e2aae434cbb1d2e53c
      NANODA_COMMIT: 3a2407216ee84a75f9e1aead6803d0578be06ae7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: dev, persist-credentials: false }
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1; free -g | head -2
      - name: The tree at main
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tree
          cd tree && git checkout -q main; git log --oneline -1
      - name: elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The compiled tree
        run: cd tree && scripts/cache.sh get 2>&1 | tail -2 && lake build Tengoku.All 2>&1 | tail -2
      - name: The import graph of Tengoku.All, from Lean, and the plan
        run: |
          cd tree
          cp ../dev/ic/ic_graph.lean ../dev/ic/ic_plan.py "$RUNNER_TEMP/"
          printf 'import Lean\nopen Lean\n#check @readModuleData\n#check @freeRegions\n#print ModuleData\n#print Import\n' > "$RUNNER_TEMP/Probe.lean"
          lake env lean "$RUNNER_TEMP/Probe.lean" 2>&1 | head -60
          s=$(date +%s)
          lake env lean --run "$RUNNER_TEMP/ic_graph.lean" Tengoku.All > "$RUNNER_TEMP/graph.tsv" 2>&1 || { echo "ic_graph failed:"; head -30 "$RUNNER_TEMP/graph.tsv"; exit 1; }
          echo "graph: $(wc -l < "$RUNNER_TEMP/graph.tsv") modules in $(( $(date +%s) - s )) s"; head -3 "$RUNNER_TEMP/graph.tsv" | cut -c1-200
          python3 "$RUNNER_TEMP/ic_plan.py" plan "$RUNNER_TEMP/graph.tsv" --cap-bytes 4000000000 --out "$RUNNER_TEMP/plan.json"
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))
          print("shards:", [(s["id"], len(s["roots"]), round(s["bytes"]/1e9, 2)) for s in p["shards"]])
          PY
      - name: lean4export and nanoda at their pinned commits
        run: |
          git clone -q https://github.com/leanprover/lean4export "$RUNNER_TEMP/lean4export"; git -C "$RUNNER_TEMP/lean4export" checkout -q "$LEAN4EXPORT_COMMIT"
          (cd "$RUNNER_TEMP/lean4export" && lake build 2>&1 | tail -1)
          git clone -q https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda"; git -C "$RUNNER_TEMP/nanoda" checkout -q "$NANODA_COMMIT"
          (cd "$RUNNER_TEMP/nanoda" && cargo build --release --locked 2>&1 | tail -1)
      - name: "Three shards (smallest, middle, largest by bytes), each: export, memory, lines, nanoda"
        run: |
          cd tree
          X="$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export"
          python3 - > "$RUNNER_TEMP/pick.txt" <<'PY'
          import json, os
          p = json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))
          ss = sorted(p["shards"], key=lambda s: s["bytes"])
          for s in (ss[0], ss[len(ss)//2], ss[-1]):
              print(s["id"], " ".join(s["roots"]))
          PY
          while read -r id roots; do
            out="$RUNNER_TEMP/shard-$id.ndjson"; s=$(date +%s)
            /usr/bin/time -v lake env "$X" $roots > "$out" 2> "$RUNNER_TEMP/t-$id.log" || echo "export of shard $id failed"
            echo "SHARD $id: roots=$(echo $roots | wc -w) lines=$(wc -l < "$out") size=$(du -h "$out" | cut -f1) export=$(( $(date +%s) - s ))s rss=$(grep 'Maximum resident' "$RUNNER_TEMP/t-$id.log" | awk '{print int($NF/1024/1024*10)/10}')GB"
            cat > "$RUNNER_TEMP/n-$id.json" <<JSON
          {"export_file_path": "$out", "use_stdin": false,
           "permitted_axioms": ["propext", "Classical.choice", "Quot.sound", "sorryAx", "Lean.ofReduceBool", "Lean.ofReduceNat", "Lean.trustCompiler"],
           "unpermitted_axiom_hard_error": true, "num_threads": 4, "nat_extension": true, "string_extension": true, "print_success_message": true, "pp_to_stdout": true}
          JSON
            s=$(date +%s)
            "$RUNNER_TEMP/nanoda/target/release/nanoda_bin" "$RUNNER_TEMP/n-$id.json" 2>&1 | tail -2
            echo "NANODA shard $id: $(( $(date +%s) - s ))s"
            rm -f "$out"
          done < "$RUNNER_TEMP/pick.txt"
