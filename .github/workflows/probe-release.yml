name: probe-release
# Throwaway (sandbox only): can the job token create a release from a workflow_dispatch run?
on:
  workflow_dispatch:
    inputs:
      target:
        description: "commit to point the release tag at (the build job used the run's older commit)"
        required: false
        default: ""
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: exact shape of cache.sh put (tag cache-<stamp>, two parts, notes)
        env:
          TENGOKU_REPO: ${{ github.repository }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          gh --version | head -1
          tmp="$(mktemp -d)"; head -c 1000 /dev/urandom > "$tmp/tengoku-cache.tar.zst.part-aa"; head -c 100 /dev/urandom > "$tmp/tengoku-cache.tar.zst.part-ab"
          sha="${TARGET:-$(git rev-parse HEAD)}"; echo "target=$sha"; stamp="$(date -u +%Y%m%dT%H%MZ)"; tag="cache-$stamp"
          gh release create "$tag" -R "$TENGOKU_REPO" --target "$sha" --title "build cache probe" \
            --notes "$(printf 'commit=%s\ntoolchain=%s\n\nCompiled .lake/build for %s.' "$sha" "$(cat lean-toolchain)" "$sha")" \
            "$tmp"/tengoku-cache.tar.zst.part-* && echo "PUT-SHAPE-OK" || echo "PUT-SHAPE-FAILED"
          gh release delete "$tag" -R "$TENGOKU_REPO" --cleanup-tag -y 2>/dev/null || true
      - name: the build job's own steps before put — free disk space, then create again
        env:
          TENGOKU_REPO: ${{ github.repository }}
        run: |
          sed -n '/Free disk space/,/Restore partial build/p' .github/workflows/build.yml | sed -n '/run: |/,/- name/p' | grep -vE "run: \||- name" | sed 's/^          //' > free.sh; echo "--- free.sh"; cat free.sh; bash free.sh || echo "free-disk-space step failed"
          gh release create "probe-after-free-$GITHUB_RUN_ID" -R "$TENGOKU_REPO" --target "$GITHUB_SHA" --title probe --notes x && echo "AFTER-FREE-OK" || echo "AFTER-FREE-FAILED"
          gh release delete "probe-after-free-$GITHUB_RUN_ID" -R "$TENGOKU_REPO" --cleanup-tag -y 2>/dev/null || true
