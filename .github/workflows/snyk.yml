# Snyk, over the repository's own code and dependencies: Snyk Code (static analysis of the Python under scripts/ and tools/ and
# the TypeScript under widget/) and Snyk Open Source (the gate's Python packages, scripts/ci/requirements/*.txt). The Lean tree
# and the records are not analysed (Snyk has no Lean analyser). ADVISORY like sonar.yml: not a required check, the merge queue
# never waits for it, and a finding blocks nothing; the SARIF goes to the repository's code-scanning alerts.
#
# The token is the repository secret SNYK_TOKEN, passed to the Snyk steps only; the organisation, when one is set, is the
# repository variable SNYK_ORG. A pull request from a fork, and one Dependabot opens, gets no secrets: the job then skips the scan
# instead of failing.
name: snyk
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tools/**", "widget/**", ".github/workflows/snyk.yml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["scripts/**", "tools/**", "widget/**", ".github/workflows/snyk.yml"]
  schedule:
    - cron: "17 5 * * 1"   # Mondays: new advisories against unchanged dependencies
  workflow_dispatch:
permissions: {}
concurrency:
  group: snyk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  scan:
    # a fork's pull request has no secrets to scan with
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, security-events: write }
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/Tengoku/
            !/data/
          persist-credentials: false
      - name: Is there a token for this run?
        id: t
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
        run: |
          if [ -n "$SNYK_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "::notice::no SNYK_TOKEN for this run (a fork's or Dependabot's pull request, or the secret is not set): the scan is skipped"; fi
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        if: steps.t.outputs.have == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.t.outputs.have == 'true'
        with: { python-version: "3.12" }
      # Snyk Code: the repository's own code. The SARIF carries every finding to the Security tab; the step itself never fails the job.
      - name: Snyk Code
        if: steps.t.outputs.have == 'true'
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}", SNYK_ORG: "${{ vars.SNYK_ORG }}" }
        run: |
          snyk code test ${SNYK_ORG:+--org="$SNYK_ORG"} --sarif-file-output=snyk-code.sarif . || echo "::warning::Snyk Code reported findings (see the code-scanning alerts)"
      # Snyk Open Source: each hash-pinned requirements file, installed into its own environment (Snyk's pip plugin reads installed packages).
      - name: Snyk Open Source (the gate's Python packages)
        if: steps.t.outputs.have == 'true'
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}", SNYK_ORG: "${{ vars.SNYK_ORG }}" }
        run: |
          for req in scripts/ci/requirements/*.txt; do
            name=$(basename "$req" .txt)
            python3 -m venv "$RUNNER_TEMP/venv-$name"
            "$RUNNER_TEMP/venv-$name/bin/pip" install -q --require-hashes --only-binary :all: -r "$req" || { echo "::warning::$req: a package has no Linux wheel here (atheris on macOS runners, say); skipped"; continue; }
            snyk test ${SNYK_ORG:+--org="$SNYK_ORG"} --file="$req" --package-manager=pip --command="$RUNNER_TEMP/venv-$name/bin/python" --sarif-file-output="snyk-oss-$name.sarif" \
              || echo "::warning::$req: Snyk reported vulnerable packages (see the code-scanning alerts)"
          done
      - name: Upload the SARIF reports
        if: steps.t.outputs.have == 'true' && hashFiles('snyk-*.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .
          category: snyk
