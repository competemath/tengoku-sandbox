# Merge-queue gate (docs/tengoku-security-plan.md §5): the only CI that runs Lean.
# Seeds the nightly cache, builds only the candidate modules of the group, checks
# axioms, regenerates derived files and diffs them. On failure the PRs in the
# group get a comment naming the file, line, record and what to do.
name: queue-gate
on:
  merge_group:
permissions: {}
env:
  TENGOKU_REPO: competemath/tengoku   # caches are read from the library, never from a sandbox
jobs:
  queue-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - name: Lean toolchain (pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: What this group changes
        id: diff
        run: |
          echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          git diff --name-only "${{ github.event.merge_group.base_sha }}" HEAD | tee changed.txt
      - name: Content lint (again, on the merged result)
        run: python3 scripts/ci/lint_banked.py "${{ github.event.merge_group.base_sha }}" HEAD
      - name: Seed from the newest published cache (verified)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/cache.sh get 2>&1 | tail -3
      - name: Generate candidates and build only them
        id: build
        shell: bash
        run: |
          set -o pipefail
          targets=()
          for f in $(grep -E '^data/staging/.*\.jsonl$' changed.txt || true); do
            lib="$(basename "$f" .jsonl)"
            python3 scripts/generate.py --candidate "$f" | tee -a build.log
            for m in $(python3 - "$lib" <<'PY'
          import sys, pathlib
          lib = sys.argv[1]
          sys.path.insert(0, "scripts"); from generate import pascal
          ns = pascal(lib)
          for p in pathlib.Path("Tengoku", ns).rglob("_candidate_*.lean"):
              print(".".join(p.with_suffix("").parts))
          PY
            ); do targets+=("$m"); done
          done
          for f in $(grep -E '^data/trusted/.*\.jsonl$' changed.txt || true); do
            lib="$(basename "$f" .jsonl)"; python3 scripts/generate.py --library "$lib" | tee -a build.log
            targets+=("Tengoku.$(python3 -c "import sys; sys.path.insert(0,'scripts'); from generate import pascal; print(pascal('$lib'))")")
          done
          if [ "${#targets[@]}" = 0 ]; then echo "no Lean targets in this group"; echo "targets=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "building: ${targets[*]}"
          echo "targets=${targets[*]}" >> "$GITHUB_OUTPUT"
          lake build "${targets[@]}" 2>&1 | tee -a build.log
          if grep -q "declaration uses .sorry." build.log; then echo "error: a candidate uses sorry" | tee -a build.log; exit 1; fi
      - name: Axioms of every new declaration
        if: steps.build.outputs.targets != ''
        run: |
          lake build tengoku-axioms 2>&1 | tail -1
          for m in ${{ steps.build.outputs.targets }}; do lake env .lake/build/bin/tengoku-axioms --module "$m" 2>&1 | tee -a build.log; done
      - name: Derived files match their generator
        run: |
          for f in $(grep -E '^data/(staging|trusted)/.*\.jsonl$' changed.txt || true); do python3 scripts/generate.py --library "$(basename "$f" .jsonl)" >/dev/null; done
          python3 scripts/stats.py >/dev/null
          git diff --exit-code -- Tengoku/ data/stats.json || { echo "error: regenerated derived files differ from the PR (hand-edited generated file?)" | tee -a build.log; exit 1; }
      - name: Explain the failure to the authors
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/ci/queue_comment.py build.log "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
