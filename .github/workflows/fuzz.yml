# ClusterFuzzLite (https://google.github.io/clusterfuzzlite/): the gate's fuzz targets (scripts/ci/fuzz), weekly and on
# demand, for longer than a pull request runs them (docs/testing.md, "Fuzzing"). A crash fails the run and names the
# input. Pull requests and the merge queue run the targets a change covers directly (scripts/ci/fuzz/run.py).
name: fuzz
on:
  schedule:
    - cron: "23 4 * * 2"   # Tuesdays
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # everything but the records and the generated Lean tree (3 GB): the build context
            /*
            !/data/
            !/Tengoku/
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          mode: batch
          sanitizer: address
          fuzz-seconds: 1200   # shared by the targets
