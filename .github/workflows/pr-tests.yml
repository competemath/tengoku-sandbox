# The PR's own lint and test suite. Unlike pr-gate.yml this runs the PR's code, which is the point:
# it tests the change itself. It decides nothing about policy (a PR can edit this file, its tests and
# its pre-commit config), and runs with a read-only token and no secrets. Tooling PRs, the ones whose
# code it tests, always wait for a maintainer's merge.
name: pr-tests
on:
  pull_request:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { filter: "blob:none", persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pipx install pre-commit && pre-commit run --all-files --show-diff-on-failure

  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, filter: "blob:none", persist-credentials: false }   # 2: the merge commit and the base (the fuzz step's diff)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -q --require-hashes -r scripts/ci/requirements/yaml.txt   # workflow_rules.py reads YAML
      # `| tail` used to hide the test result: a failing test passed the job (found by the campaign).
      - shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tail -5
          # every module in scripts/ci/tests, found the same way CONTRIBUTING.md runs them (naming modules here left
          # the goals, retractions, headlines and promotion-notify tests out of CI)
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v 2>&1 | tail -5
      # The fuzz targets of the gate scripts this PR changes (docs/testing.md, "Fuzzing"); nothing for a PR that changes
      # none. The merge queue runs the same on the merged result, and the merge waits for it there.
      - name: Fuzz the gate scripts this PR changes
        run: |
          # a separate assignment: a runner that cannot even list its targets fails the step (bash -e), never skips it
          targets="$(python3 scripts/ci/fuzz/run.py --changed HEAD^1 HEAD --list)"
          if [ -z "$targets" ]; then echo "fuzz: no target covers this change"; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/fuzz"
          "$RUNNER_TEMP/fuzz/bin/pip" install -q --require-hashes -r scripts/ci/requirements/fuzz.txt
          "$RUNNER_TEMP/fuzz/bin/python" scripts/ci/fuzz/run.py --changed HEAD^1 HEAD
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with: { args: -color }

  # The seal the gate runs a PR's Lean in (pr-gate.yml's vacuity job: `unshare --net --pid --fork --mount-proc runuser … env -i …`) is a seal on a hosted
  # runner: its self-test (scripts/ci/sandbox_selftest.py, docs/agent-security.md) runs inside exactly that command and must pass, and run outside any
  # seal it must refuse. A runner image that changes under the seal fails here, in a PR, rather than in the gate.
  sealed-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, filter: "blob:none", persist-credentials: false }   # 2: the merge commit and the base
      - id: touched
        name: Does this PR touch the seal or its self-test?
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(scripts/ci/sandbox_selftest\.py|scripts/ci/tests/test_sandbox_selftest\.py|\.github/workflows/(pr-tests|pr-gate|jinshi-pr)\.yml|scripts/ci/seal_harden\.sh)' <<< "$files"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "no file of the seal changed"
          fi
      - name: Outside any seal the self-test refuses (and runs nothing)
        if: steps.touched.outputs.run == 'yes'
        run: |
          if python3 scripts/ci/sandbox_selftest.py -- touch "$RUNNER_TEMP/ran"; then echo "::error::the self-test passed on an unsealed runner"; exit 1; fi
          [ ! -e "$RUNNER_TEMP/ran" ]
      # exactly the command of pr-gate.yml's vacuity step (test_sandbox_selftest.py keeps the two in step): the four probes open on a hosted runner are named
      - name: Inside the seal of pr-gate.yml it passes, and names the four things it leaves open
        if: steps.touched.outputs.run == 'yes'
        run: |
          sudo unshare --net --pid --fork --mount-proc runuser -u "$(id -un)" -- \
            env -i HOME="$HOME" PATH="$HOME/.elan/bin:/usr/local/bin:/usr/bin:/bin" LANG=C.UTF-8 \
            TENGOKU_CI_ROOT="$GITHUB_WORKSPACE" \
            python3 scripts/ci/sandbox_selftest.py --allow-env TENGOKU_CI_ROOT \
              --advisory cannot_write_system --advisory cannot_write_runner_channels --advisory cannot_read_runner_credentials --advisory no_container_socket \
              -- echo "the sealed command ran" | tee sealed.out
          grep -c '^warn ' sealed.out | grep -qx 4
      # the same seal with scripts/ci/seal_harden.sh in front of the command: every probe passes, no --advisory
      - name: Inside the hardened seal it passes with nothing left open
        if: steps.touched.outputs.run == 'yes'
        run: |
          sudo unshare --net --pid --fork --mount-proc sh scripts/ci/seal_harden.sh "$(id -un)" -- \
            env -i HOME="$HOME" PATH="$HOME/.elan/bin:/usr/local/bin:/usr/bin:/bin" LANG=C.UTF-8 \
            TENGOKU_CI_ROOT="$GITHUB_WORKSPACE" \
            python3 scripts/ci/sandbox_selftest.py --allow-env TENGOKU_CI_ROOT -- echo "the hardened command ran"
      - name: The hardening was for the step only (the job still reaches Docker)
        if: steps.touched.outputs.run == 'yes'
        run: curl -sf --unix-socket /var/run/docker.sock http://localhost/_ping | grep -qx OK

  # The program that lists the tree's command keywords (tools/CommandKeywords.lean; the content lint reads schemas/command-keywords.json) compiles and runs on a
  # clean checkout. Smoke test on Lean's own grammar: the tree is not built here, the nightly build compares the real list.
  command-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, filter: "blob:none", persist-credentials: false }   # 2: the merge commit and the base
      - id: touched
        name: Does this PR touch the command keywords?
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(tools/CommandKeywords\.lean|schemas/command-keywords\.json|scripts/ci/cmdkw_check\.py|scripts/ci/allowlist\.py|lean-toolchain|\.github/workflows/pr-tests\.yml)' <<< "$files"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "no file of the command keywords changed"
          fi
      - name: elan (the installer at a fixed commit, checked against its digest before it runs)
        if: steps.touched.outputs.run == 'yes'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The program lists the keywords of Lean's own grammar
        if: steps.touched.outputs.run == 'yes'
        run: |
          lake env lean --run tools/CommandKeywords.lean Lean > keywords.txt
          wc -l keywords.txt
          [ "$(wc -l < keywords.txt)" -gt 50 ]
          for w in theorem def instance namespace '#eval' initialize macro elab; do grep -qx -- "$w" keywords.txt || { echo "::error::$w is not in the list Lean reported"; exit 1; }; done

  # The identity recipe (docs/isnad.md), rebuilt from a clean checkout: the executable, the golden ids of Lean core theorems, and the laws on real
  # elaborated statements. Runs the PR's code like the jobs above; nothing for a PR that touches none of the recipe's files.
  isnad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, filter: "blob:none", persist-credentials: false }   # 2: the merge commit and the base
      - id: touched
        name: Does this PR touch the isnad recipe?
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(TengokuIsnad\.lean|lakefile\.toml|lean-toolchain|scripts/isnad(_tag)?\.py|tools/isnad/|docs/isnad\.md|\.github/workflows/pr-tests\.yml)' <<< "$files"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "no file of the isnad recipe changed"
          fi
      - name: elan (the installer at a fixed commit, checked against its digest before it runs)
        if: steps.touched.outputs.run == 'yes'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the executable (it imports only Lean, no cache and no tree)
        if: steps.touched.outputs.run == 'yes'
        run: lake build tengoku-isnad
      - name: Golden ids
        if: steps.touched.outputs.run == 'yes'
        run: python3 scripts/isnad.py selftest
      - name: Laws
        if: steps.touched.outputs.run == 'yes'
        run: python3 scripts/isnad.py laws
      - name: The tagger on a real compile
        if: steps.touched.outputs.run == 'yes'
        run: python3 scripts/isnad.py tagtest
  jinshi:
    # the examinations' self-test (docs/jinshi.md, "Running"): the fixtures with their planted faults, compiled against Lean's own
    # library, every fault found and nothing else reported; only when a file of the recipe changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, filter: "blob:none", persist-credentials: false }   # 2: the merge commit and the base
      - id: touched
        name: Does this PR touch the Jinshi recipe?
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(TengokuJinshi\.lean|lakefile\.toml|lean-toolchain|scripts/jinshi/|tools/jinshi/fixtures/|docs/jinshi\.md|\.github/workflows/pr-tests\.yml)' <<< "$files"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "no file of the Jinshi recipe changed"
          fi
      - name: elan (the installer at a fixed commit, checked against its digest before it runs)
        if: steps.touched.outputs.run == 'yes'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the examinations (they import only Lean, no cache and no tree)
        if: steps.touched.outputs.run == 'yes'
        run: lake build tengoku-jinshi
      - name: The fixtures
        if: steps.touched.outputs.run == 'yes'
        run: python3 scripts/jinshi/selftest.py
