# Round trip of Lake's remote artifact cache with a throwaway S3 store ON THE RUNNER (MinIO), 2026-10-13: no secret, no bucket,
# nothing persists. It proves the queue's shape end to end: build with `-o`, `lake cache put` (SigV4 upload), then a second,
# empty workspace does `lake cache get` by git revision (including the backtrack a merge-group commit needs) and
# `lake build --no-build` succeeds from downloads alone. The real store only changes the two endpoint URLs and the key.
name: lake-cache-roundtrip
on:
  workflow_dispatch:
    inputs:
      target:
        description: "the build target whose closure is round-tripped (small enough for the runner's disk three times over)"
        required: false
        default: "Tengoku.Pfr"
permissions: {}
defaults:
  run:
    shell: bash
env:
  TENGOKU_REPO: ${{ github.repository }}
  TENGOKU_VERIFY: require
  TENGOKU_TOPUPS: "1"
  LAKE_ARTIFACT_CACHE: "true"
  # the throwaway store: MinIO on localhost, created below with a password made up in the job (LAKE_CACHE_KEY is set there)
  LAKE_CACHE_ARTIFACT_ENDPOINT: http://127.0.0.1:9000/lake/a0
  LAKE_CACHE_REVISION_ENDPOINT: http://127.0.0.1:9000/lake/r0
  SCOPE: tengoku-sandbox
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, filter: "blob:none", persist-credentials: false }
      - name: Lean toolchain (pinned by lean-toolchain) and zstd
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q zstd >/dev/null
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium || true
          sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1
      - name: A throwaway S3 store on this runner (MinIO), bucket `lake`, anonymous reads
        run: |
          mkdir -p "$RUNNER_TEMP/minio"
          pw="$(openssl rand -hex 16)"   # the store's root credential for this job only; never written to the file
          echo "::add-mask::$pw"
          { echo "MINIO_PW=$pw"; echo "LAKE_CACHE_KEY=lake:$pw"; } >> "$GITHUB_ENV"
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=lake -e "MINIO_ROOT_PASSWORD=$pw" -e MINIO_SITE_REGION=auto -v "$RUNNER_TEMP/minio:/data" minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host -e "MC_PW=$pw" --entrypoint sh minio/mc -c 'mc alias set m http://127.0.0.1:9000 lake "$MC_PW" >/dev/null && mc mb m/lake && mc anonymous set download m/lake'
          export LAKE_CACHE_KEY="lake:$pw"
          # Lake's own kind of request: a SigV4 PUT with curl, then an anonymous GET of the same object
          echo probe > "$RUNNER_TEMP/probe.txt"
          curl -sf --aws-sigv4 aws:amz:auto:s3 --user "$LAKE_CACHE_KEY" -X PUT -T "$RUNNER_TEMP/probe.txt" http://127.0.0.1:9000/lake/a0/probe.txt
          test "$(curl -sf http://127.0.0.1:9000/lake/a0/probe.txt)" = probe && echo "store answers: SigV4 PUT (region auto) and anonymous GET work"
      - name: Seed from the newest published cache (today's way)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          scripts/cache.sh get 2>&1 | tail -3
          { df -h / | tail -1; du -sh .lake/build; } | sed 's/^/after seeding: /'
      - name: Build the target with the artifact cache on, mappings to a file
        env: { TARGET: "${{ github.event.inputs.target }}", LAKE_CACHE_DIR: "${{ github.workspace }}/.lake/cache" }
        run: |
          start=$(date +%s)
          lake build "$TARGET" -o out.jsonl 2>&1 | tail -3
          echo "took $(( $(date +%s) - start )) s; mappings: $(wc -l < out.jsonl) lines"
          du -sh .lake/build .lake/cache 2>/dev/null; df -h / | tail -1
      - name: "Upload: lake cache put (artifacts by content hash + the mappings under this revision)"
        env: { LAKE_CACHE_DIR: "${{ github.workspace }}/.lake/cache" }
        run: |
          start=$(date +%s)
          lake cache put out.jsonl --scope "$SCOPE" 2>&1 | tail -5
          echo "took $(( $(date +%s) - start )) s"
          echo "objects in the store: $(docker run --rm --network host -e "MC_PW=$MINIO_PW" --entrypoint sh minio/mc -c 'mc alias set m http://127.0.0.1:9000 lake "$MC_PW" >/dev/null && mc ls -r m/lake | wc -l')"; du -sh "$RUNNER_TEMP/minio" | cut -f1 | sed 's/^/store size: /'
          echo "the revision file: $(docker run --rm --network host -e "MC_PW=$MINIO_PW" --entrypoint sh minio/mc -c 'mc alias set m http://127.0.0.1:9000 lake "$MC_PW" >/dev/null && mc ls -r m/lake/r0')"
      - name: A second, empty workspace (fresh clone, fresh cache dir) gets everything by revision and builds with --no-build
        env: { TARGET: "${{ github.event.inputs.target }}", LAKE_CACHE_DIR: "${{ runner.temp }}/cache2" }
        run: |
          git clone -q --filter=blob:none "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ws2" && cd "$RUNNER_TEMP/ws2"
          start=$(date +%s)
          lake cache get --scope "$SCOPE" 2>&1 | tail -5
          echo "get took $(( $(date +%s) - start )) s; cache2: $(du -sh "$LAKE_CACHE_DIR" | cut -f1), $(find "$LAKE_CACHE_DIR" -type f | wc -l) files"
          start=$(date +%s)
          lake build "$TARGET" --no-build 2>&1 | tail -2
          echo "--no-build from downloads alone: ok, took $(( $(date +%s) - start )) s"
      - name: "The merge-group case: a commit on top has no mappings of its own; Lake backtracks to the parent"
        env: { TARGET: "${{ github.event.inputs.target }}", LAKE_CACHE_DIR: "${{ runner.temp }}/cache3" }
        run: |
          git clone -q --filter=blob:none "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ws3" && cd "$RUNNER_TEMP/ws3"
          mkdir -p Tengoku/Probe && printf 'import %s\n\ntheorem Tengoku.Probe.hello : 1 + 1 = 2 := rfl\n' "$TARGET" > Tengoku/Probe/Hello.lean
          git -c user.name=probe -c user.email=probe@example.invalid add -A && git -c user.name=probe -c user.email=probe@example.invalid commit -qm "a group on top"
          lake cache get --scope "$SCOPE" 2>&1 | tail -4
          start=$(date +%s)
          lake build Tengoku.Probe.Hello -o out3.jsonl 2>&1 | tail -3
          echo "the group built in $(( $(date +%s) - start )) s on top of downloads; mappings of this build: $(wc -l < out3.jsonl) lines"
          # the group's own new mappings: its lines minus every mapping the store already had (the revision files `lake cache get`
          # downloaded): a deterministic set difference, staged for a privileged uploader
          python3 - "$LAKE_CACHE_DIR" <<'PY'
          import glob, sys
          had = set()
          for f in glob.glob(sys.argv[1] + "/revisions/**/*.jsonl", recursive=True):
              had.update(l.strip() for l in open(f) if l.strip())
          mine = [l.strip() for l in open("out3.jsonl") if l.strip()]
          new = [l for l in mine if l not in had]
          open("out-new.jsonl", "w").write("".join(l + "\n" for l in new))
          print(f"this build's mappings: {len(mine)}; already in the store: {len(mine) - len(new)}; new (the group's own): {len(new)}")
          PY
          lake cache stage out-new.jsonl staging 2>&1 | tail -1
          echo "staged for upload: $(find staging -type f | wc -l) files, $(du -sh staging | cut -f1)"
          lake cache put-staged staging --scope "$SCOPE" --rev "$(git rev-parse HEAD)" 2>&1 | tail -3
          echo "the store now has a revision file for the group's commit: $(docker run --rm --network host -e "MC_PW=$MINIO_PW" --entrypoint sh minio/mc -c 'mc alias set m http://127.0.0.1:9000 lake "$MC_PW" >/dev/null && mc ls -r m/lake/r0' | wc -l) revision files"
      - name: "Control: an empty workspace with the store gone must not build with --no-build"
        env: { TARGET: "${{ github.event.inputs.target }}", LAKE_CACHE_DIR: "${{ runner.temp }}/cache4" }
        run: |
          docker rm -f minio >/dev/null
          git clone -q --filter=blob:none "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ws4" && cd "$RUNNER_TEMP/ws4"
          if lake cache get --scope "$SCOPE" >/dev/null 2>&1 && lake build "$TARGET" --no-build >/dev/null 2>&1; then echo "::error::built with no store?"; exit 1; else echo "refused as expected"; fi
