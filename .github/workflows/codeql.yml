# CodeQL: GitHub's code scanner, over the repository's Python and its workflows (results under Security → Code
# scanning). It runs only when code or workflows change, on the pull request and on main, and weekly; the data
# pull requests that make up most of the traffic never start it, so it takes no runner from the merge queue.
name: codeql
on:
  pull_request:
    branches: [main]
    paths: ["**/*.py", ".github/**", "scripts/**", "tools/**"]
  push:
    branches: [main]
    paths: ["**/*.py", ".github/**", "scripts/**", "tools/**"]
  schedule:
    - cron: "41 5 * * 1"   # Mondays
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, actions: read, security-events: write }   # security-events: the results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # everything but the records and the generated Lean tree (3 GB)
            /*
            !/data/
            !/Tengoku/
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
