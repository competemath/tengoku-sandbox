# SonarQube Cloud analysis of the repository's own code (sonar-project.properties says which): bugs, security
# hotspots, maintainability, duplication. ADVISORY: it is not one of the required checks (`pr-gate`, `queue-gate`),
# the merge queue never waits for it, and a failing quality gate blocks nothing.
#
# Pull requests are analysed by the `sonar` job of pr-tests.yml, on the coverage its tests measure (one test run per PR,
# not two). This file is the main branch: it runs when code changes, so the baseline "new code" is measured against
# stays current without a scan per data merge.
#
# The token is the repository secret SONAR_TOKEN, passed to the scan step only.
name: sonar
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tools/**", ".github/**", ".coveragerc", "sonar-project.properties"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      # everything but the Lean tree, the data and the widget (the tests read schemas/, the docs and the root files): the
      # full history (the scanner blames lines to find new code) of a sparse tree
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/Tengoku/
            !/data/
            !/widget/
          persist-credentials: false
      # The scanner blames every line (to find new code) with JGit, which cannot fetch a missing blob from a partial clone:
      # the first scan of main died on "Missing blob". Fetch the history of the scanned paths only (all but the Lean tree, the data and the widget): a few hundred
      # commits and a couple of thousand objects, not the data's.
      - name: Fetch the history blobs the blame reads
        run: |
          git rev-list --objects --all --missing=print -- . ':!Tengoku' ':!data' ':!widget' | sed -n 's/^?//p' > "$RUNNER_TEMP/missing.txt"
          echo "$(wc -l < "$RUNNER_TEMP/missing.txt") history blobs to fetch"
          if [ -s "$RUNNER_TEMP/missing.txt" ]; then
            xargs -n 300 git -c fetch.negotiationAlgorithm=noop fetch origin --no-tags --no-write-fetch-head --recurse-submodules=no --filter=blob:none < "$RUNNER_TEMP/missing.txt"
          fi
          echo "still missing: $(git rev-list --objects --all --missing=print -- . ':!Tengoku' ':!data' ':!widget' | grep -c '^?' || true)"
      # The unit tests under coverage.py (.coveragerc), for the coverage SonarQube Cloud shows: the same commands as
      # pr-tests.yml's `Unit tests, measured`. No secret is in this job's environment until the scan step.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Unit tests, measured
        run: |
          pip install -q --require-hashes --only-binary :all: -r scripts/ci/requirements/yaml.txt -r scripts/ci/requirements/coverage.txt
          coverage run -m unittest discover -s scripts/tests
          coverage run -m unittest discover -s scripts/ci/tests -p 'test_*.py'
          coverage combine
          coverage xml
          coverage report --skip-empty | tail -40
      - name: Is there a token for this run?
        id: t
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "::notice::no SONAR_TOKEN for this run: the scan is skipped"; fi
      - name: Analyse
        if: steps.t.outputs.have == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }
      # The same report to Codecov (coverage history, the per-file view, the badge). Advisory like the scan: the token is
      # the repository secret CODECOV_TOKEN, on this step only; an upload that fails does not fail the job.
      - name: Is there a Codecov token for this run?
        id: c
        env: { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "::notice::no CODECOV_TOKEN for this run: the Codecov upload is skipped"; fi
      - name: Upload coverage to Codecov
        if: steps.c.outputs.have == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
