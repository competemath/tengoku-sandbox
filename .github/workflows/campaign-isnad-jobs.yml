name: campaign-isnad-jobs
run-name: "campaign for the tagger running its batches three at a time: check-tags and tag of tengoku#710's modules, main's scripts against the fix's, times, memory, and the outputs compared"
on:
  push:
    branches: [campaign-isnad-jobs]
permissions: { contents: read }
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TENGOKU_CACHE_SOURCE: competemath/tengoku
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda || true
          df -h / | tail -1; nproc; free -m | head -2
      - name: "The PR's tree (tengoku#710 at its head) and the two copies of scripts (main's and the fix's)"
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/competemath/tengoku tree
          cd tree
          git fetch -q origin "+refs/pull/710/head:refs/remotes/pr" "+refs/heads/fix/isnad-batches-in-parallel:refs/remotes/fix" main
          git checkout -q --detach refs/remotes/pr
          for v in main fix; do
            rev=origin/main; [ "$v" = fix ] && rev=refs/remotes/fix
            mkdir -p "../scripts-$v"; git archive "$rev" scripts | tar -x -C "../scripts-$v"
          done
          git log --oneline -1
          B=$(git merge-base HEAD origin/main)
          git diff --name-only --diff-filter=A "$B" HEAD -- Tengoku | grep '\.lean$' | grep -v -E '/Deps\.lean$|^Tengoku/All\.lean$|^Tengoku/[^/]+\.lean$' | sed -E 's#\.lean$##; s#/#.#g' | sort > /tmp/mods.txt
          echo "modules: $(wc -l < /tmp/mods.txt)"
      - name: elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The compiled tree, the PR's modules (not timed) and the tagger's executable
        run: |
          cd tree && scripts/cache.sh get 2>&1 | tail -1
          mods=(); while read -r m; do mods+=("$m"); done < /tmp/mods.txt
          lake build "${mods[@]}" 2>&1 | tail -1
          lake build tengoku-isnad 2>&1 | tail -1
      - name: "Where the time goes: facts() of the PR's modules with the fix, --jobs 1 and 3 on 75 modules, then --jobs 3 on all of them; every tengoku-isnad call timed, memory sampled"
        run: |
          cd tree
          rm -rf scripts && cp -r ../scripts-fix/scripts scripts
          cat > /tmp/prof.py <<'PY'
          import sys, time, threading, subprocess, os
          sys.path.insert(0, "scripts")
          import isnad
          label, jobs, limit = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          mods = open("/tmp/mods.txt").read().split()[: limit or None]
          log, lock = [], threading.Lock()
          def wrap(f, kind):
              def g(args, *a, **k):
                  n = sum(1 for x in args if x == "--module")
                  t = time.time(); r = f(args, *a, **k); d = time.time() - t
                  with lock: log.append((kind, n, d))
                  return r
              return g
          isnad.run_exe = wrap(isnad.run_exe, "recs")
          isnad.run_exe_lines = wrap(isnad.run_exe_lines, "ranges")
          t0 = time.time()
          recs, ranges = isnad.facts(mods, [], None, 25, exact=True, jobs=jobs)
          wall = time.time() - t0
          alone = [(k, d) for k, n, d in log if n == 1]
          batch = [(k, d) for k, n, d in log if n > 1]
          print(f"RESULT {label}: {len(mods)} modules, --jobs {jobs}: facts took {wall:.0f} s; {len(batch)} batch calls ({sum(d for _, d in batch):.0f} s of process time), {len(alone)} calls on a single module ({sum(d for _, d in alone):.0f} s of process time); {len(recs)} records, {len(ranges)} ranges")
          import hashlib
          print(f"RESULT {label}: digest {hashlib.sha256(chr(10).join(r.name + r.module + r.canonical for r in recs).encode() + chr(10).join(ranges).encode()).hexdigest()[:16]}")
          PY
          run() {
            label=$1; shift
            base=$(free -m | awk '/Mem:/{print $7}'); rm -f /tmp/min.$label; echo $base > /tmp/min.$label
            ( min=$base; while sleep 2; do a=$(free -m | awk '/Mem:/{print $7}'); if [ "$a" -lt "$min" ]; then min=$a; echo "$min" > /tmp/min.$label; fi; done ) &
            S=$!
            python3 /tmp/prof.py $label "$@"
            kill $S 2>/dev/null || true; wait $S 2>/dev/null || true
            echo "RESULT $label: memory used at most $(( base - $(cat /tmp/min.$label) )) MB of $base MB available at the start"
          }
          run subset-jobs3 3 75
          run subset-jobs1 1 75
          run all-jobs3 3 0
