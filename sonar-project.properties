# SonarQube Cloud (https://sonarcloud.io, organisation competemath): the repository's own code, which is what its
# analysers can read: the Python and shell under scripts/ and tools/, and the workflow files. The Lean tree, the records
# and the vendored corpora are not analysed (Sonar has no Lean analyser, and data/ is gigabytes).
sonar.organization=competemath
sonar.projectKey=competemath_tengoku-sandbox
sonar.sources=scripts,tools,.github
# the tests are analysed as tests, not as sources; the campaign's fixtures hold fake credentials on purpose, and the
# fuzz corpus is a set of deliberately odd inputs
sonar.tests=scripts/tests,scripts/ci/tests
sonar.exclusions=scripts/tests/**,scripts/ci/tests/**,scripts/ci/campaign/**,scripts/ci/fuzz/corpus/**,**/__pycache__/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# No coverage report is uploaded: the gate scripts run as subprocesses in their tests, which coverage would not see.
# Excluding everything from the coverage calculation keeps the quality gate's coverage condition from failing on
# lines nobody measured.
sonar.coverage.exclusions=**/*
