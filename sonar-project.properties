# SonarQube Cloud (https://sonarcloud.io, organisation competemath): the repository's own code, which is what its
# analysers can read: the Python and shell under scripts/ and tools/, and what is under .github/ (the workflows and
# Dependabot's configuration). The Lean tree, the records
# and the vendored corpora are not analysed (Sonar has no Lean analyser, and data/ is gigabytes).
sonar.organization=competemath
sonar.projectKey=competemath_tengoku
# SonarQube's analysis scope covers the whole checked-out tree (sonar.yml checks out only scripts/, tools/ and
# .github/), so no sonar.sources or sonar.tests: both would be ignored. What is left out: the tests, the campaign's
# fixtures (they hold fake credentials on purpose) and the fuzz corpus (deliberately odd inputs).
sonar.exclusions=scripts/tests/**,scripts/ci/tests/**,scripts/ci/campaign/**,scripts/ci/fuzz/corpus/**,**/__pycache__/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# Coverage: the unit tests of scripts/tests and scripts/ci/tests, run under coverage.py by sonar.yml (.coveragerc says
# what is measured and how: branches too, the gate scripts the tests run as subprocesses, and every file under scripts/
# and tools/ whether a test imports it or not, so an untested script counts as 0%). Python only: Sonar has no coverage
# for the shell scripts or the workflows. Left out of the calculation, and nothing else: the fuzz targets (they run
# under atheris in fuzz.yml, not in the unit tests).
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=scripts/ci/fuzz/**
# No dependency analysis (SCA): Sonar would run `pip install -r` on every requirements file it finds, in the job that
# holds SONAR_TOKEN, and it failed on files that pin different versions of one package for different jobs
# (scripts/ci/requirements/). FOSSA already scans the dependencies.
sonar.sca.enabled=false
